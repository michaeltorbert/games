<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Quarter and halftime break overlay mockup</title>
  <desc id="desc">A full-screen quarter break overlay with dim stadium background, broadcast banner, score, next possession, and button.</desc>
  <defs>
    <radialGradient id="spot" cx="50%" cy="20%" r="70%">
      <stop offset="0" stop-color="#285f8a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#081408" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#003087"/>
      <stop offset="0.5" stop-color="#102a66"/>
      <stop offset="1" stop-color="#4a8db8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#071014"/>
  <rect x="0" y="0" width="1200" height="760" rx="34" fill="url(#spot)"/>
  <path d="M0 160 C180 96 420 130 610 170 C790 210 990 115 1200 165 L1200 274 L0 274 Z" fill="#06120d"/>
  <g opacity="0.55" fill="#1d3428">
    <circle cx="110" cy="210" r="4"/><circle cx="145" cy="198" r="3"/><circle cx="180" cy="215" r="4"/>
    <circle cx="810" cy="210" r="4"/><circle cx="852" cy="196" r="3"/><circle cx="905" cy="216" r="4"/>
    <circle cx="1005" cy="205" r="4"/><circle cx="1040" cy="194" r="3"/><circle cx="1085" cy="216" r="4"/>
  </g>
  <rect x="160" y="250" width="880" height="185" rx="20" fill="url(#banner)" stroke="#ffd62e" stroke-width="5"/>
  <rect x="160" y="250" width="880" height="44" rx="18" fill="#08142d" opacity="0.82"/>
  <text x="600" y="280" font-family="Arial Black, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffd62e">BROADCAST BREAK</text>
  <text x="600" y="352" font-family="Arial Black, Arial, sans-serif" font-size="58" text-anchor="middle" fill="#ffffff">END OF 1ST QUARTER</text>
  <text x="600" y="402" font-family="Arial Black, Arial, sans-serif" font-size="34" text-anchor="middle" fill="#ffd62e">DUKE 14  -  UNC 7</text>
  <text x="600" y="465" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#e8f2ff">Next possession: Opponent's ball</text>
  <rect x="460" y="506" width="280" height="70" rx="10" fill="#ffd62e"/>
  <text x="600" y="552" font-family="Arial Black, Arial, sans-serif" font-size="26" text-anchor="middle" fill="#12285c">START Q2</text>

  <rect x="160" y="628" width="880" height="54" rx="10" fill="#08142d" opacity="0.8"/>
  <text x="600" y="663" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#cde8d4">Motion: dim field, sweep banner in, pop score and next-possession details. Reduced motion: static fade.</text>
</svg>
