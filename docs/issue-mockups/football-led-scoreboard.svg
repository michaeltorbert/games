<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">LED scoreboard treatment mockup</title>
  <desc id="desc">A compact scorebug with digital score numerals and subtle dot matrix texture.</desc>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#08100d"/>
  <text x="600" y="86" font-family="Arial Black, Arial, sans-serif" font-size="34" text-anchor="middle" fill="#ffffff">LED-style scoreboard pass</text>
  <text x="600" y="124" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#a8c7da">Use LED texture where it helps. Keep labels simple and readable.</text>

  <rect x="110" y="208" width="980" height="170" rx="18" fill="#060a0c" stroke="#26313a" stroke-width="6"/>
  <rect x="126" y="224" width="948" height="138" rx="12" fill="#101820"/>
  <rect x="126" y="224" width="948" height="138" rx="12" fill="url(#dots)"/>
  <line x1="338" y1="224" x2="338" y2="362" stroke="#26313a" stroke-width="4"/>
  <line x1="550" y1="224" x2="550" y2="362" stroke="#26313a" stroke-width="4"/>
  <line x1="704" y1="224" x2="704" y2="362" stroke="#26313a" stroke-width="4"/>
  <line x1="870" y1="224" x2="870" y2="362" stroke="#26313a" stroke-width="4"/>
  <text x="174" y="268" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#8db8ff">DUKE</text>
  <text x="236" y="332" font-family="Courier New, monospace" font-size="76" font-weight="700" fill="#ffd62e" filter="url(#glow)" text-anchor="middle">14</text>
  <text x="390" y="268" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#9ed9ff">UNC</text>
  <text x="452" y="332" font-family="Courier New, monospace" font-size="76" font-weight="700" fill="#ffd62e" filter="url(#glow)" text-anchor="middle">07</text>
  <text x="603" y="268" font-family="Arial, sans-serif" font-size="18" fill="#8eaadf">QTR</text>
  <text x="627" y="326" font-family="Courier New, monospace" font-size="58" font-weight="700" fill="#ffffff" filter="url(#glow)" text-anchor="middle">2</text>
  <text x="742" y="268" font-family="Arial, sans-serif" font-size="18" fill="#8eaadf">DOWN</text>
  <text x="787" y="324" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle">3RD &amp; 4</text>
  <text x="920" y="268" font-family="Arial, sans-serif" font-size="18" fill="#8eaadf">BALL</text>
  <text x="975" y="324" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle">OWN 46</text>

  <rect x="196" y="462" width="808" height="126" rx="16" fill="#12285c" stroke="#ffd62e" stroke-width="4"/>
  <text x="600" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#ffffff">Question panel stays friendly and readable.</text>
  <text x="600" y="552" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#cde8d4">The LED look is limited to the sports status display.</text>
</svg>
