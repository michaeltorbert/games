<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Grass and dust particle effect mockup</title>
  <desc id="desc">A three-panel storyboard showing ball movement with subtle grass and dust particles.</desc>
  <rect width="1200" height="760" rx="34" fill="#071014"/>
  <text x="600" y="78" font-family="Arial Black, Arial, sans-serif" font-size="34" text-anchor="middle" fill="#ffffff">Ball movement particle effect</text>
  <text x="600" y="116" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#a8c7da">Subtle grass/dust flecks trail the ball, then disappear.</text>

  <g transform="translate(78 174)">
    <rect width="320" height="390" rx="18" fill="#12331c" stroke="#f4fff2" stroke-width="5"/>
    <text x="160" y="46" font-family="Arial Black, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffffff">1. Before</text>
    <rect x="45" y="92" width="230" height="148" rx="9" fill="#2fa246"/>
    <g stroke="#f4fff2" stroke-opacity="0.55" stroke-width="2"><path d="M91 92 V240"/><path d="M137 92 V240"/><path d="M183 92 V240"/><path d="M229 92 V240"/></g>
    <ellipse cx="137" cy="166" rx="28" ry="16" fill="#8d3f1d" stroke="#e8a36f" stroke-width="3" transform="rotate(-18 137 166)"/>
    <text x="160" y="300" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#cde8d4">Ball is still.</text>
  </g>

  <g transform="translate(440 174)">
    <rect width="320" height="390" rx="18" fill="#12331c" stroke="#ffd62e" stroke-width="5"/>
    <text x="160" y="46" font-family="Arial Black, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffffff">2. Advance</text>
    <rect x="45" y="92" width="230" height="148" rx="9" fill="#2fa246"/>
    <g stroke="#f4fff2" stroke-opacity="0.55" stroke-width="2"><path d="M91 92 V240"/><path d="M137 92 V240"/><path d="M183 92 V240"/><path d="M229 92 V240"/></g>
    <path d="M136 166 C164 148 187 150 212 166" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" opacity="0.55"/>
    <g fill="#d7c076" opacity="0.95">
      <circle cx="136" cy="172" r="3"/><circle cx="152" cy="158" r="2.5"/><circle cx="166" cy="177" r="2"/><circle cx="184" cy="156" r="2.8"/>
    </g>
    <g stroke="#85e06d" stroke-width="4" stroke-linecap="round">
      <path d="M148 184 l-8 6"/><path d="M176 180 l-7 5"/><path d="M196 156 l-8 4"/>
    </g>
    <ellipse cx="215" cy="166" rx="28" ry="16" fill="#8d3f1d" stroke="#e8a36f" stroke-width="3" transform="rotate(-18 215 166)"/>
    <text x="160" y="300" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#cde8d4">Burst appears around the movement path.</text>
  </g>

  <g transform="translate(802 174)">
    <rect width="320" height="390" rx="18" fill="#12331c" stroke="#f4fff2" stroke-width="5"/>
    <text x="160" y="46" font-family="Arial Black, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffffff">3. Fade</text>
    <rect x="45" y="92" width="230" height="148" rx="9" fill="#2fa246"/>
    <g stroke="#f4fff2" stroke-opacity="0.55" stroke-width="2"><path d="M91 92 V240"/><path d="M137 92 V240"/><path d="M183 92 V240"/><path d="M229 92 V240"/></g>
    <g fill="#d7c076" opacity="0.22"><circle cx="160" cy="174" r="2"/><circle cx="181" cy="156" r="2"/><circle cx="196" cy="178" r="2"/></g>
    <ellipse cx="215" cy="166" rx="28" ry="16" fill="#8d3f1d" stroke="#e8a36f" stroke-width="3" transform="rotate(-18 215 166)"/>
    <text x="160" y="300" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#cde8d4">Particles fade and are removed.</text>
  </g>
  <text x="600" y="660" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#cde8d4">Reduced motion: skip the burst or show a single static dust puff.</text>
</svg>
