<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 32" width="200" height="320">
  <!-- Proposed replacement for the #player sprite. Same viewBox and animated part classes as football/index.html. -->
  <style>
    .pl-pants { fill: none; stroke: #f4f6fa; stroke-width: 2.7; stroke-linecap: round; }
    .pl-sock { fill: none; stroke: #003087; stroke-width: 2.2; stroke-linecap: round; }
    .pl-cleat { fill: #14161b; }
    .pl-hips { fill: #f4f6fa; stroke: #c9d2de; stroke-width: .35; }
    .pl-belt { stroke: #003087; stroke-width: .7; }
    .pl-sleeve { fill: none; stroke: #003087; stroke-width: 2.8; stroke-linecap: round; }
    .pl-forearm { fill: none; stroke: #f4f6fa; stroke-width: 2.1; stroke-linecap: round; }
    .pl-glove { fill: #ffffff; stroke: #c9d2de; stroke-width: .35; }
    .pl-jersey { fill: #003087; }
    .pl-pads { fill: #0a3fa6; stroke: #001f5c; stroke-width: .35; }
    .pl-stripe { fill: none; stroke: #ffffff; stroke-width: .7; stroke-linecap: round; }
    .pl-number { fill: #ffffff; font: 800 6.4px 'Barlow Condensed', 'Nunito', sans-serif; text-anchor: middle; }
    .pl-helmet { fill: #003087; stroke: #001f5c; stroke-width: .4; }
    .pl-helmet-stripe { fill: none; stroke: #ffffff; stroke-width: 1.1; stroke-linecap: round; }
    .pl-ear { fill: #001f5c; }
    .pl-mask { fill: none; stroke: #b9c2cc; stroke-width: .75; stroke-linecap: round; }
    /* Pivot each limb at its joint in viewBox coordinates. */
    .pl-leg-l, .pl-leg-r, .pl-arm-l, .pl-arm-r { transform-box: view-box; }
    .pl-leg-l { transform-origin: 8.4px 21.5px; }
    .pl-leg-r { transform-origin: 11.6px 21.5px; }
    .pl-arm-l { transform-origin: 5.2px 11.6px; }
    .pl-arm-r { transform-origin: 14.8px 11.6px; }
    /* With real shoulder pivots, raising an arm needs a clockwise turn on the left and counter-clockwise on the right. */
    .player-celebrating .pl-arm-l { animation-name: arm-up-l-v2; }
    .player-celebrating .pl-arm-r { animation-name: arm-up-r-v2; }
    @keyframes arm-up-l-v2 { 0%, 100% { transform: rotate(0); } 30%, 60% { transform: rotate(125deg); } }
    @keyframes arm-up-r-v2 { 0%, 100% { transform: rotate(0); } 30%, 60% { transform: rotate(-125deg); } }
  </style>
    <g class="pl-leg-l">
      <path class="pl-pants" d="M8.4 21.5 L7.9 25.2" />
      <path class="pl-sock" d="M7.9 25.2 L7.4 28.4" />
      <path class="pl-cleat" d="M5.6 29.6 C5.6 28.5 6.6 28.1 7.6 28.1 C8.6 28.1 9.2 28.6 9.2 29.6 Z" />
    </g>
    <g class="pl-leg-r">
      <path class="pl-pants" d="M11.6 21.5 L12.1 25.2" />
      <path class="pl-sock" d="M12.1 25.2 L12.6 28.4" />
      <path class="pl-cleat" d="M10.8 29.6 C10.8 28.6 11.4 28.1 12.4 28.1 C13.4 28.1 14.4 28.5 14.4 29.6 Z" />
    </g>
    <path class="pl-hips" d="M6.1 18.6 H13.9 L14.1 22.4 C12.8 23.1 7.2 23.1 5.9 22.4 Z" />
    <path class="pl-belt" d="M6.1 19.3 H13.9" />
    <path class="pl-jersey" d="M5.4 11.2 C5.4 10.4 6 10 6.8 10 H13.2 C14 10 14.6 10.4 14.6 11.2 L14 19 H6 Z" />
    <path class="pl-pads" d="M3.9 12.4 C3.9 10.3 5.4 9.1 7.4 9.1 H12.6 C14.6 9.1 16.1 10.3 16.1 12.4 C14.6 12.9 13.2 12.1 12.4 11.6 H7.6 C6.8 12.1 5.4 12.9 3.9 12.4 Z" />
    <path class="pl-stripe" d="M4.5 11.7 C5.4 11.9 6.3 11.5 7 11 M15.5 11.7 C14.6 11.9 13.7 11.5 13 11" />
    <text class="pl-number" x="10" y="17.4">7</text>
    <g class="pl-arm-l">
      <path class="pl-sleeve" d="M5.2 11.6 L3.2 14.6" />
      <path class="pl-forearm" d="M3.2 14.6 L2.4 16.4" />
      <circle class="pl-glove" cx="2.3" cy="16.9" r="1.25" />
    </g>
    <g class="pl-arm-r">
      <path class="pl-sleeve" d="M14.8 11.6 L16.8 14.6" />
      <path class="pl-forearm" d="M16.8 14.6 L17.6 16.4" />
      <circle class="pl-glove" cx="17.7" cy="16.9" r="1.25" />
    </g>
    <path class="pl-helmet" d="M5.1 5.6 C5.1 2.6 7.3 0.6 10.1 0.6 C13 0.6 15 2.7 15 5.4 L15 7.4 C15 8.3 14.3 8.9 13.4 8.9 H7.2 C6 8.9 5.1 8 5.1 6.8 Z" />
    <path class="pl-helmet-stripe" d="M9.1 0.8 C8.1 2.6 7.9 5 8.4 8.8" />
    <circle class="pl-ear" cx="9.4" cy="5.6" r="0.75" />
    <path class="pl-mask" d="M13.4 4.6 H16.4 M13.4 6.3 H16.4 M13.8 7.9 H15.9 M16.2 4.4 V8.1" />
  </svg>
