<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Football stadium and crowd background mockup</title>
  <desc id="desc">A football game screen with stadium lights, crowd silhouette, scorebug, field, question panel, and answer buttons.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.5" stop-color="#0b2f18"/>
      <stop offset="1" stop-color="#071014"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#e9fbff" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#e9fbff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e9fbff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="crowd" width="34" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="12" r="2.2" fill="#274333"/>
      <circle cx="17" cy="8" r="2" fill="#355943"/>
      <circle cx="27" cy="14" r="2.4" fill="#1d3428"/>
    </pattern>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#003087"/>
      <stop offset="0.06" stop-color="#003087"/>
      <stop offset="0.061" stop-color="#2fa246"/>
      <stop offset="0.94" stop-color="#278f3b"/>
      <stop offset="0.941" stop-color="#7bafd4"/>
      <stop offset="1" stop-color="#7bafd4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#sky)"/>
  <ellipse cx="260" cy="20" rx="320" ry="270" fill="url(#light)"/>
  <ellipse cx="940" cy="20" rx="320" ry="270" fill="url(#light)"/>
  <path d="M0 200 C190 120 420 150 600 190 C790 232 1000 124 1200 208 L1200 338 L0 338 Z" fill="#06120d"/>
  <path d="M0 218 C210 148 420 176 600 214 C790 252 990 162 1200 226 L1200 338 L0 338 Z" fill="url(#crowd)" opacity="0.75"/>
  <path d="M70 285 L1130 285 L1190 368 L10 368 Z" fill="#0b1511" opacity="0.86"/>
  <g opacity="0.18" stroke="#dff8ff" stroke-width="7">
    <path d="M245 30 L424 330"/>
    <path d="M955 30 L776 330"/>
  </g>

  <rect x="185" y="88" width="830" height="62" rx="10" fill="#07183d" stroke="#1f3d83" stroke-width="3"/>
  <rect x="185" y="88" width="148" height="62" rx="10" fill="#003087"/>
  <rect x="333" y="88" width="148" height="62" fill="#4a8db8"/>
  <text x="222" y="126" font-family="Arial Black, Arial, sans-serif" font-size="20" fill="#ffffff">DUKE</text>
  <text x="295" y="132" font-family="Arial Black, Arial, sans-serif" font-size="34" fill="#ffd62e">14</text>
  <text x="370" y="126" font-family="Arial Black, Arial, sans-serif" font-size="20" fill="#ffffff">UNC</text>
  <text x="443" y="132" font-family="Arial Black, Arial, sans-serif" font-size="34" fill="#ffd62e">7</text>
  <text x="535" y="114" font-family="Arial, sans-serif" font-size="13" fill="#8eaadf">QTR</text>
  <text x="544" y="137" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#ffffff">2</text>
  <text x="640" y="114" font-family="Arial, sans-serif" font-size="13" fill="#8eaadf">DOWN</text>
  <text x="630" y="137" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#ffffff">3RD &amp; 4</text>
  <text x="806" y="114" font-family="Arial, sans-serif" font-size="13" fill="#8eaadf">BALL ON</text>
  <text x="808" y="137" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#ffffff">OWN 46</text>
  <text x="955" y="132" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#ffd62e">▶</text>

  <rect x="120" y="230" width="960" height="300" rx="18" fill="url(#field)" stroke="#f4fff2" stroke-width="9"/>
  <g opacity="0.18">
    <rect x="178" y="230" width="82" height="300" fill="#001b0f"/>
    <rect x="342" y="230" width="82" height="300" fill="#001b0f"/>
    <rect x="506" y="230" width="82" height="300" fill="#001b0f"/>
    <rect x="670" y="230" width="82" height="300" fill="#001b0f"/>
    <rect x="834" y="230" width="82" height="300" fill="#001b0f"/>
  </g>
  <g stroke="#f4fff2" stroke-opacity="0.62" stroke-width="3">
    <path d="M216 230 V530"/>
    <path d="M312 230 V530"/>
    <path d="M408 230 V530"/>
    <path d="M504 230 V530"/>
    <path d="M600 230 V530"/>
    <path d="M696 230 V530"/>
    <path d="M792 230 V530"/>
    <path d="M888 230 V530"/>
    <path d="M984 230 V530"/>
  </g>
  <text x="138" y="394" transform="rotate(-90 138 394)" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">DUKE</text>
  <text x="1062" y="320" transform="rotate(90 1062 320)" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#06234a">CAROLINA</text>
  <line x1="642" y1="230" x2="642" y2="530" stroke="#ffd62e" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="560" cy="382" rx="36" ry="20" fill="#8d3f1d" stroke="#e8a36f" stroke-width="4" transform="rotate(-18 560 382)"/>
  <path d="M540 376 C552 368 568 368 581 376" fill="none" stroke="#f8dfc9" stroke-width="4" stroke-linecap="round"/>

  <rect x="210" y="558" width="780" height="74" rx="14" fill="#102a66" stroke="#ffd62e" stroke-width="4"/>
  <text x="600" y="604" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#ffffff">What yard line is the ball on?</text>
  <g fill="#2db82d" stroke="#ffd700" stroke-width="4">
    <rect x="230" y="654" width="165" height="54" rx="8"/>
    <rect x="420" y="654" width="165" height="54" rx="8"/>
    <rect x="615" y="654" width="165" height="54" rx="8"/>
    <rect x="805" y="654" width="165" height="54" rx="8"/>
  </g>
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#cde8d4">Animated crowd silhouette sits behind the field, not behind the controls.</text>
</svg>
