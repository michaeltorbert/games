<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Defense scorebug accent mockup</title>
  <desc id="desc">Comparison of offense and defense scorebug treatments for the football game.</desc>
  <rect width="1200" height="760" rx="34" fill="#071014"/>
  <text x="600" y="76" font-family="Arial Black, Arial, sans-serif" font-size="34" text-anchor="middle" fill="#ffffff">Scorebug possession states</text>
  <text x="600" y="112" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#a8c7da">Defense should read differently from the top bar alone.</text>

  <text x="160" y="178" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#7df2c7">Current offense feel</text>
  <rect x="160" y="206" width="880" height="88" rx="12" fill="#07183d" stroke="#1f3d83" stroke-width="4"/>
  <rect x="160" y="206" width="170" height="88" rx="12" fill="#003087"/>
  <rect x="330" y="206" width="170" height="88" fill="#4a8db8"/>
  <text x="202" y="258" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#ffffff">DUKE</text>
  <text x="282" y="266" font-family="Arial Black, Arial, sans-serif" font-size="44" fill="#ffd62e">14</text>
  <text x="374" y="258" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#ffffff">UNC</text>
  <text x="454" y="266" font-family="Arial Black, Arial, sans-serif" font-size="44" fill="#ffd62e">7</text>
  <text x="560" y="242" font-family="Arial, sans-serif" font-size="14" fill="#8eaadf">QTR</text>
  <text x="566" y="270" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff">2</text>
  <text x="670" y="242" font-family="Arial, sans-serif" font-size="14" fill="#8eaadf">DOWN</text>
  <text x="660" y="270" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff">3RD &amp; 4</text>
  <text x="850" y="242" font-family="Arial, sans-serif" font-size="14" fill="#8eaadf">BALL</text>
  <text x="830" y="270" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff">OWN 46</text>
  <text x="984" y="266" font-family="Arial Black, Arial, sans-serif" font-size="44" fill="#ffd62e">▶</text>

  <text x="160" y="380" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#ffb347">Proposed defense feel</text>
  <rect x="160" y="408" width="880" height="132" rx="12" fill="#07183d" stroke="#ffb347" stroke-width="4"/>
  <rect x="160" y="408" width="880" height="34" rx="10" fill="#3a2207"/>
  <text x="600" y="432" font-family="Arial Black, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#ffcf8a">OPPONENT BALL - DEFENSE</text>
  <rect x="160" y="442" width="170" height="98" fill="#003087"/>
  <rect x="330" y="442" width="170" height="98" fill="#4a8db8"/>
  <rect x="500" y="442" width="540" height="98" fill="#0b1634"/>
  <text x="202" y="500" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#ffffff">DUKE</text>
  <text x="282" y="508" font-family="Arial Black, Arial, sans-serif" font-size="44" fill="#ffd62e">14</text>
  <text x="374" y="500" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#ffffff">UNC</text>
  <text x="454" y="508" font-family="Arial Black, Arial, sans-serif" font-size="44" fill="#ffd62e">7</text>
  <text x="560" y="484" font-family="Arial, sans-serif" font-size="14" fill="#ffcf8a">QTR</text>
  <text x="566" y="512" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff">2</text>
  <text x="670" y="484" font-family="Arial, sans-serif" font-size="14" fill="#ffcf8a">DOWN</text>
  <text x="660" y="512" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff">3RD &amp; 4</text>
  <text x="850" y="484" font-family="Arial, sans-serif" font-size="14" fill="#ffcf8a">BALL</text>
  <text x="830" y="512" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffffff">OPP 46</text>
  <text x="984" y="508" font-family="Arial Black, Arial, sans-serif" font-size="44" fill="#ffb347">◀</text>

  <g fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="10 8">
    <path d="M1028 490 C1090 488 1090 280 1026 252"/>
  </g>
  <text x="968" y="630" font-family="Arial, sans-serif" font-size="18" text-anchor="end" fill="#ffcf8a">Defense accent changes the bar, not just the field.</text>
</svg>
