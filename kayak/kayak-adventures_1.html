<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sydney & Michael's Kayak Adventures 🛶</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a3a5c;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }
  #gameContainer { position: relative; display: inline-block; }
  canvas { display: block; border: 4px solid #8B6914; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,0.7); }

  /* HUD */
  #hud {
    position: absolute; top: 10px; left: 10px;
    background: rgba(255,255,255,0.90); border: 3px solid #8B6914;
    border-radius: 8px; padding: 7px 12px; pointer-events: none;
    color: #5a3800; font-weight: bold;
  }
  #hud .lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #8B6914; }
  #hud .sc { font-size: 24px; line-height: 1.1; }
  #hud .best { font-size: 10px; color: #8B6914; margin-top: 2px; }
  #newGameBtn {
    pointer-events: all; margin-top: 5px; background: #8B6914; color: white;
    border: none; border-radius: 5px; padding: 4px 9px; font-size: 10px;
    font-family: 'Georgia', serif; cursor: pointer; display: block; width: 100%;
  }
  #newGameBtn:hover { background: #a07820; }

  /* Level banner */
  #lvlBanner {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.90); border: 3px solid #8B6914;
    border-radius: 8px; padding: 5px 14px; font-size: 12px; font-weight: bold;
    color: #5a3800; letter-spacing: 0.5px; white-space: nowrap; pointer-events: none;
    text-align: center; max-width: 280px;
  }

  /* Overlay screens */
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; pointer-events: all;
  }
  #overlay.hidden { display: none; }

  /* Postcard */
  .postcard {
    background: #fffdf4; border: 4px solid #8B6914; border-radius: 10px;
    padding: 20px 24px; max-width: 86%; text-align: center;
    box-shadow: 4px 4px 0 #8B6914;
  }
  .postcard .stamp { font-size: 32px; margin-bottom: 4px; }
  .postcard .pc-title { font-size: 18px; font-weight: bold; color: #5a3800; margin-bottom: 4px; }
  .postcard .pc-sub { font-size: 11px; color: #8B6914; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
  .postcard .pc-fact { font-size: 13px; color: #333; line-height: 1.5; margin-bottom: 14px; font-style: italic; }
  .postcard .pc-love { font-size: 12px; color: #c04060; margin-bottom: 14px; }
  .postcard button {
    background: #8B6914; color: white; border: none; border-radius: 6px;
    padding: 8px 20px; font-size: 13px; font-family: 'Georgia', serif;
    cursor: pointer; margin: 4px;
  }
  .postcard button:hover { background: #a07820; }
  .postcard button.sec { background: #4a8a6a; }
  .postcard button.sec:hover { background: #3a7a5a; }

  /* Map screen */
  #mapCanvas { border-radius: 8px; border: 3px solid #8B6914; }

  /* D-pad */
  #dpad {
    position: absolute; bottom: 14px; right: 14px;
    width: 112px; height: 112px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 3px; opacity: 0.75;
  }
  .dpad-btn {
    background: rgba(255,255,255,0.6); border: 2px solid #8B6914;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .dpad-btn.pressed, .dpad-btn:active { background: rgba(139,105,20,0.5); }
  .dpad-center { background: rgba(255,255,255,0.2); border: none; }
</style>

// Random bonus levels (after all 12 done)
const BONUS_STAMPS = ['🌍','🗺️','⚓','🌊','🏄','🚣'];
const BONUS_NAMES = ['Mystery Lagoon','Hidden Cove','Secret River','Lost Lake','The Blue Grotto','Enchanted Bay'];

// ═══════════════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function setSize() {
  const maxW = Math.min(window.innerWidth - 8, 500);
  const maxH = Math.min(window.innerHeight - 8, 750);
  const ratio = 500/750;
  let w = maxW, h = maxW/ratio;
  if (h > maxH) { h = maxH; w = h*ratio; }
  canvas.width = Math.floor(w);
  canvas.height = Math.floor(h);
}
setSize();
window.addEventListener('resize', setSize);
const W = () => canvas.width;
const H = () => canvas.height;
const sc = () => W()/500;

// ═══════════════════════════════════════════════════════════════
// PERSISTENT STORAGE
// ═══════════════════════════════════════════════════════════════
let highScore = parseInt(localStorage.getItem('kayakAdv_hs') || '0', 10);
let totalScore = parseInt(localStorage.getItem('kayakAdv_score') || '0', 10);
let currentLevel = parseInt(localStorage.getItem('kayakAdv_level') || '0', 10);
let visitedLevels = JSON.parse(localStorage.getItem('kayakAdv_visited') || '[]');

function persist() {
  localStorage.setItem('kayakAdv_score', totalScore);
  localStorage.setItem('kayakAdv_level', currentLevel);
  localStorage.setItem('kayakAdv_visited', JSON.stringify(visitedLevels));
  if (totalScore > highScore) {
    highScore = totalScore;
    localStorage.setItem('kayakAdv_hs', highScore);
  }
  document.getElementById('highScoreDisplay').textContent = highScore;
}

// ═══════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════
const kayak = { x:0, y:0, angle:0, vx:0, vy:0, vAngle:0, paddlePhase:0 };
let collectibles = [];
let ripples = [];
let splashParticles = [];
let waterTime = 0;
let holdTime = 0, holdTimeBack = 0;
let lastPaddleSound = 0;
let gamePhase = 'playing'; // 'playing' | 'levelcomplete'

// ═══════════════════════════════════════════════════════════════
// WATER AREAS — each level defines its own lake polygon
// ═══════════════════════════════════════════════════════════════
function defaultLakePoly(w, h) {
  return [
    [w*0.07, h*0.38+h*0.06], [w*0.22, h*0.38+h*0.01],
    [w*0.50, h*0.38],        [w*0.78, h*0.38+h*0.01],
    [w*0.93, h*0.38+h*0.06],[w*0.97, h*0.60],
    [w*0.97, h*0.97],        [w*0.03, h*0.97],
    [w*0.03, h*0.60]
  ];
}
function riverPoly(w, h) {
  // Winding river — wider middle strip
  return [
    [w*0.0,  h*0.38], [w*1.0, h*0.35],
    [w*1.0,  h*0.97], [w*0.0, h*0.97]
  ];
}
function beachPoly(w, h) {
  // Beach — open at the bottom, sea takes up most
  return [
    [w*0.0, h*0.45], [w*1.0, h*0.42],
    [w*1.0, h*0.97], [w*0.0, h*0.97]
  ];
}
function lazyRiverPoly(w, h) {
  // Meandering lazy river loop
  return [
    [w*0.05,h*0.30],[w*0.95,h*0.32],[w*0.95,h*0.55],
    [w*0.60,h*0.60],[w*0.60,h*0.75],[w*0.95,h*0.78],
    [w*0.95,h*0.97],[w*0.05,h*0.97],[w*0.05,h*0.72],
    [w*0.40,h*0.68],[w*0.40,h*0.52],[w*0.05,h*0.50]
  ];
}

function getLakePoly(levelIdx) {
  const w = W(), h = H();
  if (levelIdx === 6) return lazyRiverPoly(w, h);
  if (levelIdx === 2 || levelIdx === 5 || levelIdx === 7 || levelIdx === 8 || levelIdx === 10) return beachPoly(w, h);
  if (levelIdx === 3 || levelIdx === 9 || levelIdx === 11) return riverPoly(w, h);
  return defaultLakePoly(w, h);
}

function pointInPoly(px, py, poly) {
  let inside = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++) {
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if (((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function isInLake(x, y) { return pointInPoly(x, y, getLakePoly(currentLevel)); }

// ═══════════════════════════════════════════════════════════════
// COLLECTIBLES
// ═══════════════════════════════════════════════════════════════
function spawnCollectibles() {
  collectibles = [];
  const poly = getLakePoly(currentLevel);
  const lvl = getLevelDef();
  const types = lvl.collectibles;
  let attempts = 0;
  while (collectibles.length < 9 && attempts < 600) {
    attempts++;
    const lx = W()*(0.06 + Math.random()*0.88);
    const ly = H()*(0.35 + Math.random()*0.60);
    if (pointInPoly(lx, ly, poly) && Math.hypot(lx-kayak.x, ly-kayak.y) > W()*0.12) {
      collectibles.push({
        x: lx, y: ly,
        type: types[Math.floor(Math.random()*types.length)],
        bob: Math.random()*Math.PI*2,
        scale: 0.85 + Math.random()*0.3,
        collected: false, fadeOut: 0
      });
    }
  }
  document.getElementById('colTotal').textContent = collectibles.length;
  document.getElementById('colDisplay').textContent = 0;
}

// ═══════════════════════════════════════════════════════════════
// LEVEL HELPERS
// ═══════════════════════════════════════════════════════════════
function getLevelDef() {
  if (currentLevel < LEVELS.length) return LEVELS[currentLevel];
  // Bonus random level
  const idx = (currentLevel - LEVELS.length) % BONUS_NAMES.length;
  return {
    name: BONUS_NAMES[idx], sub: 'Mystery Destination ✨',
    stamp: BONUS_STAMPS[idx % BONUS_STAMPS.length],
    fact: 'A surprise destination unlocked after completing all 12 stops on Sydney & Michael\'s adventure!',
    collectibles: ['💕','😘','✨','🌸','💐','🌺','🦋','⭐','💫'],
    mapDot: [0.5 + Math.random()*0.3, 0.3 + Math.random()*0.3],
    waterColor: ['#3AB8D8','#1A7890'],
    skyColor: ['#68C8F0','#A0E0FF'],
    bgColor: '#1a3a5a',
    drawScene: drawGenericBeach
  };
}

function getKayakStart() {
  if (currentLevel === 6) return [W()*0.5, H()*0.42]; // lazy river
  if (getLakePoly(currentLevel) === beachPoly(W(), H())) return [W()*0.5, H()*0.70];
  if (getLakePoly(currentLevel) === riverPoly(W(), H())) return [W()*0.3, H()*0.65];
  return [W()*0.50, H()*0.72];
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function initLevel(reset) {
  if (reset) {
    currentLevel = 0;
    totalScore = 0;
    visitedLevels = [];
    persist();
  }
  const [sx, sy] = getKayakStart();
  kayak.x = sx; kayak.y = sy;
  kayak.angle = -Math.PI/2;
  kayak.vx = 0; kayak.vy = 0; kayak.vAngle = 0; kayak.paddlePhase = 0;
  holdTime = 0; holdTimeBack = 0;
  ripples = []; splashParticles = [];
  gamePhase = 'playing';

  const lvl = getLevelDef();
  document.getElementById('lvlBanner').textContent =
    `🛶 Level ${currentLevel+1} · ${lvl.name}`;
  document.getElementById('colDisplay').textContent = '0';
  document.getElementById('highScoreDisplay').textContent = highScore;
  document.getElementById('overlay').classList.add('hidden');

  spawnCollectibles();
}

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

const touchKeys = {};
['btn-up','btn-down','btn-left','btn-right'].forEach(id => {
  const btn = document.getElementById(id);
  const dir = id.split('-')[1];
  btn.addEventListener('touchstart', e => { e.preventDefault(); touchKeys[dir]=true; btn.classList.add('pressed'); }, {passive:false});
  btn.addEventListener('touchend',   e => { e.preventDefault(); touchKeys[dir]=false; btn.classList.remove('pressed'); }, {passive:false});
  btn.addEventListener('mousedown',  () => touchKeys[dir]=true);
  btn.addEventListener('mouseup',    () => touchKeys[dir]=false);
});
function isKey(...k) { return k.some(x => keys[x] || touchKeys[x]); }

// ═══════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
let audioUnlocked = false;
function unlockAudio() { if (!audioUnlocked) { audioCtx.resume(); audioUnlocked=true; } }
document.addEventListener('keydown', unlockAudio);
canvas.addEventListener('touchstart', unlockAudio);

function playPaddleSound() {
  if (!audioUnlocked) return;
  try {
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(180+Math.random()*60, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime+0.18);
    g.gain.setValueAtTime(0.07, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.18);
    o.start(); o.stop(audioCtx.currentTime+0.18);
  } catch(e){}
}
function playCollectSound() {
  if (!audioUnlocked) return;
  try {
    [523,659,784,1047].forEach((freq,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0, audioCtx.currentTime+i*0.07);
      g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime+i*0.07+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+i*0.07+0.2);
      o.start(audioCtx.currentTime+i*0.07); o.stop(audioCtx.currentTime+i*0.07+0.22);
    });
  } catch(e){}
}
function playLevelCompleteSound() {
  if (!audioUnlocked) return;
  try {
    [392,494,587,784,988].forEach((freq,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0, audioCtx.currentTime+i*0.12);
      g.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime+i*0.12+0.04);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+i*0.12+0.35);
      o.start(audioCtx.currentTime+i*0.12); o.stop(audioCtx.currentTime+i*0.12+0.4);
    });
  } catch(e){}
}

// RIPPLES & SPLASH
// ═══════════════════════════════════════════════════════════════
function addRipple(x,y) { ripples.push({x,y,r:0,alpha:0.55,age:0}); }
function updateRipples(dt) {
  ripples=ripples.filter(r=>r.alpha>0.02);
  ripples.forEach(r=>{ r.r+=22*sc()*dt; r.alpha-=0.55*dt; r.age+=dt; });
}
function drawRipples() {
  ripples.forEach(r=>{
    ctx.save(); ctx.strokeStyle=`rgba(255,255,255,${r.alpha})`;
    ctx.lineWidth=1.5*sc();
    ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*0.4,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  });
}
function addSplash(x,y) {
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2;
    splashParticles.push({x,y,vx:Math.cos(a)*(20+Math.random()*35)*sc(),vy:Math.sin(a)*(20+Math.random()*35)*sc()-18*sc(),alpha:1,life:0.5+Math.random()*0.3});
  }
}
function updateSplash(dt) {
  splashParticles=splashParticles.filter(p=>p.alpha>0.05);
  splashParticles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=55*sc()*dt; p.alpha-=dt/p.life; });
}
function drawSplash() {
  splashParticles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.alpha; ctx.fillStyle='#AADDF5';
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5*sc(),0,Math.PI*2); ctx.fill(); ctx.restore();
  });
}

function drawSky(w, h, c1, c2, bandH=0.42) {
  const g=ctx.createLinearGradient(0,0,0,h*bandH);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h*bandH);
}
function drawCloud(x,y,r) {
  ctx.save(); ctx.fillStyle='rgba(255,253,240,0.85)';
  [[0,0,r],[-r*0.7,r*0.2,r*0.75],[r*0.7,r*0.2,r*0.75],[-r*1.3,r*0.5,r*0.6],[r*1.3,r*0.5,r*0.6],[0,r*0.45,r*0.65]]
    .forEach(([bx,by,br])=>{ ctx.beginPath(); ctx.arc(x+bx*sc(),y+by*sc(),br*sc(),0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}
function drawClouds(w,h) {
  drawCloud(w*0.12,h*0.06,20); drawCloud(w*0.35,h*0.04,16);
  drawCloud(w*0.62,h*0.07,19); drawCloud(w*0.84,h*0.05,22);
}
function drawWater(w, h, poly, c1, c2, t) {
  const g=ctx.createLinearGradient(0,h*0.35,0,h);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(poly[0][0],poly[0][1]);
  for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
  ctx.closePath(); ctx.fill();
  // shimmer lines
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(poly[0][0],poly[0][1]);
  for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1.5*sc();
  for(let i=0;i<12;i++){
    const wy=h*0.40+i*h*0.055+Math.sin(t*0.9+i*0.8)*3*sc();
    ctx.beginPath(); ctx.moveTo(w*0.03,wy);
    ctx.bezierCurveTo(w*0.3,wy+Math.sin(t+i)*4*sc(),w*0.7,wy-Math.sin(t+i)*4*sc(),w*0.97,wy);
    ctx.stroke();
  }
  ctx.restore();
}

function drawKayak(x, y, angle, paddlePhase) {
  const s=sc();
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle+Math.PI/2);
  // shadow
  ctx.save(); ctx.translate(3*s,5*s); ctx.globalAlpha=0.22; ctx.fillStyle='#002244';
  ctx.beginPath(); ctx.ellipse(0,0,15*s,46*s,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  // hull
  ctx.fillStyle='#2A7A30'; ctx.strokeStyle='#1A5020'; ctx.lineWidth=2*s;
  ctx.beginPath(); ctx.ellipse(0,0,15*s,46*s,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#E07020'; ctx.lineWidth=3*s;
  ctx.beginPath(); ctx.ellipse(0,0,11*s,42*s,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#1A4520';
  ctx.beginPath(); ctx.ellipse(0,0,9*s,28*s,0,0,Math.PI*2); ctx.fill();
  // ── Sydney (front paddler) ──
  // life vest (orange)
  ctx.fillStyle='#F5A020'; ctx.beginPath(); ctx.ellipse(0,-18*s,6*s,7*s,0,0,Math.PI*2); ctx.fill();
  // vest straps
  ctx.strokeStyle='#C07010'; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.moveTo(-5*s,-18*s); ctx.lineTo(5*s,-18*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-18*s); ctx.lineTo(0,-12*s); ctx.stroke();
  // dark jacket under vest
  ctx.fillStyle='#2A3A50'; ctx.beginPath(); ctx.ellipse(0,-16*s,5*s,6*s,0,0,Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle='#D08050'; ctx.beginPath(); ctx.ellipse(0,-25*s,5*s,5*s,0,0,Math.PI*2); ctx.fill();
  // brown hair (from behind, shoulder length)
  ctx.fillStyle='#7B3F10';
  ctx.beginPath(); ctx.ellipse(1*s,-24*s,5.5*s,4.5*s,0.1,0,Math.PI); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2*s,-23*s,3*s,7*s,0.4,Math.PI*0.1,Math.PI*0.9); ctx.fill();
  ctx.beginPath(); ctx.ellipse(2*s,-23*s,3*s,7*s,-0.4,Math.PI*0.1,Math.PI*0.9); ctx.fill();

  // ── Michael (rear paddler) ──
  // orange legs visible at bottom
  ctx.fillStyle='#E06820';
  ctx.beginPath(); ctx.ellipse(-5*s,10*s,4*s,10*s,0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5*s,10*s,4*s,10*s,-0.3,0,Math.PI*2); ctx.fill();
  // dark jacket body
  ctx.fillStyle='#1E2E40'; ctx.beginPath(); ctx.ellipse(0,1*s,6*s,7*s,0,0,Math.PI*2); ctx.fill();
  // life vest (slightly different shade — same orange but visible over jacket)
  ctx.fillStyle='#F08018'; ctx.beginPath(); ctx.ellipse(0,0*s,5*s,6*s,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#B06010'; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.moveTo(-4*s,0*s); ctx.lineTo(4*s,0*s); ctx.stroke();
  // Michael's head (seen from slightly behind/side — shorter hair)
  ctx.fillStyle='#C07840'; ctx.beginPath(); ctx.ellipse(0,-7*s,5*s,5*s,0,0,Math.PI*2); ctx.fill();
  // short dark hair
  ctx.fillStyle='#3A2510';
  ctx.beginPath(); ctx.ellipse(0,-8*s,5.5*s,3.5*s,0,0,Math.PI); ctx.fill();
  // ── Paddles ──
  const t01 = holdTime / 2.8;
  const swing = Math.sin(paddlePhase) * 0.55;
  // Sydney's paddle (front)
  ctx.save(); ctx.translate(0,-18*s); ctx.rotate(swing * 0.7);
  ctx.strokeStyle='#4070D0'; ctx.lineWidth=2*s;
  ctx.beginPath(); ctx.moveTo(-30*s,0); ctx.lineTo(30*s,0); ctx.stroke();
  ctx.fillStyle='#2050A0'; ctx.strokeStyle='#1A3A80'; ctx.lineWidth=1*s;
  ctx.beginPath(); ctx.ellipse(-30*s,0,9*s,4*s,-0.25,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(30*s,0,9*s,4*s,0.25,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
  // Michael's paddle (rear)
  ctx.save(); ctx.translate(0,2*s); ctx.rotate(swing);
  ctx.strokeStyle='#4070D0'; ctx.lineWidth=2.5*s;
  ctx.beginPath(); ctx.moveTo(-36*s,0); ctx.lineTo(36*s,0); ctx.stroke();
  ctx.fillStyle='#2050A0'; ctx.strokeStyle='#1A3A80'; ctx.lineWidth=1*s;
  ctx.beginPath(); ctx.ellipse(-36*s,0,11*s,5*s,-0.25,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(36*s,0,11*s,5*s,0.25,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawCollectibles(t) {
  collectibles.forEach(c=>{
    if(c.collected&&c.fadeOut>=1) return;
    const bob=Math.sin(t*1.5+c.bob)*3*sc();
    ctx.save();
    if(c.collected) ctx.globalAlpha=Math.max(0,1-c.fadeOut*3);
    ctx.font=`${Math.floor(20*sc()*c.scale)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(255,255,255,0.8)'; ctx.shadowBlur=6;
    ctx.fillText(c.type, c.x, c.y+bob);
    ctx.restore();
  });
}

function drawJaimeDuque(w, h, t) {
  drawSky(w,h,'#3EB0E8','#7DD4F5');

  const cx=w*0.50, base=h*0.41, s=sc();

  ctx.fillStyle='#F5E8A0'; ctx.strokeStyle='#C8A030'; ctx.lineWidth=2*s;
  ctx.beginPath(); ctx.rect(cx-120*s,base-40*s,60*s,40*s); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.rect(cx+60*s,base-40*s,60*s,40*s); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.rect(cx-60*s,base-55*s,120*s,55*s); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#B06020';
  ctx.beginPath(); ctx.rect(cx-18*s,base-40*s,36*s,40*s); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,base-40*s,18*s,Math.PI,0); ctx.fill();
  ctx.fillStyle='#D4A830'; ctx.strokeStyle='#A07820'; ctx.lineWidth=2*s;
  ctx.beginPath(); ctx.arc(cx,base-55*s,38*s,Math.PI,0); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,200,0.45)';
  ctx.beginPath(); ctx.arc(cx-10*s,base-78*s,14*s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8B6010';
  ctx.beginPath(); ctx.moveTo(cx,base-93*s); ctx.lineTo(cx-3*s,base-55*s); ctx.lineTo(cx+3*s,base-55*s); ctx.closePath(); ctx.fill();
  [[cx-60*s,base-55*s,14*s],[cx+60*s,base-55*s,14*s]].forEach(([dx,dy,dr])=>{
    ctx.fillStyle='#D4A830'; ctx.beginPath(); ctx.arc(dx,dy,dr,Math.PI,0); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#8B6010'; ctx.beginPath(); ctx.moveTo(dx,dy-dr-6*s); ctx.lineTo(dx-2*s,dy-dr); ctx.lineTo(dx+2*s,dy-dr); ctx.closePath(); ctx.fill();
  });
  function minaret(mx,my){
    ctx.fillStyle='#EEDD88'; ctx.strokeStyle='#C8A030'; ctx.lineWidth=1.5*s;
    ctx.beginPath(); ctx.rect(mx-5*s,my-80*s,10*s,80*s); ctx.fill(); ctx.stroke();
    [1,2,3].forEach(i=>{ ctx.fillStyle='#C8A030'; ctx.beginPath(); ctx.rect(mx-7*s,my-80*s*0.3*i,14*s,4*s); ctx.fill(); });
    ctx.fillStyle='#D4A830'; ctx.beginPath(); ctx.arc(mx,my-80*s,7*s,Math.PI,0); ctx.fill(); ctx.stroke();
  }
  minaret(cx-140*s,base); minaret(cx+140*s,base);
  ctx.globalAlpha=0.65; minaret(cx-95*s,base-4*s); minaret(cx+95*s,base-4*s); ctx.globalAlpha=1;
  // vegetation
  ctx.fillStyle='#4A9B45'; ctx.fillRect(0,h*0.395,w,h*0.022);
  ctx.fillStyle='#3D7B2A'; ctx.beginPath(); ctx.ellipse(w*0.09,h*0.41,w*0.08,h*0.025,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3D7B2A'; ctx.beginPath(); ctx.ellipse(w*0.88,h*0.41,w*0.09,h*0.025,0,0,Math.PI*2); ctx.fill();
  // cypress right
  ctx.fillStyle='#2A6020';
  ctx.beginPath(); ctx.moveTo(w*0.89,h*0.20); ctx.lineTo(w*0.86,h*0.41); ctx.lineTo(w*0.92,h*0.41); ctx.closePath(); ctx.fill();
  // water
  const poly=getLakePoly(0);
  drawWater(w,h,poly,'#3AA8D8','#1A6090',t);
  // reflection shimmer
  ctx.save();
  ctx.beginPath(); ctx.moveTo(poly[0][0],poly[0][1]);
  for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
  ctx.closePath(); ctx.clip();

  ctx.fillStyle=rg; ctx.fillRect(w*0.25,h*0.40,w*0.5,h*0.18);

}

  ctx.fillStyle='#7090B0';

function drawCartagena(w, h, t) {
  // Sunset sky
  const sg=ctx.createLinearGradient(0,0,0,h*0.45);
  sg.addColorStop(0,'#FF7020'); sg.addColorStop(0.5,'#FFB040'); sg.addColorStop(1,'#FFD880');
  ctx.fillStyle=sg; ctx.fillRect(0,0,w,h*0.45);
  const s=sc();
  // Sun
  ctx.fillStyle='#FFE040'; ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.arc(w*0.75,h*0.12,22*s,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(w*0.75,h*0.12,32*s,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  // Colonial wall silhouette
  ctx.fillStyle='#8B6020';
  ctx.beginPath(); ctx.rect(0,h*0.32,w,h*0.10); ctx.fill();
  // battlements
  for(let i=0;i<12;i++){
    ctx.fillStyle='#7A5010';
    ctx.beginPath(); ctx.rect(w*(i/12),h*0.29,w*0.06,h*0.04); ctx.fill();
  }
  // palm trees
  function palm(px,py){
    const s=sc();
    ctx.fillStyle='#3D2A10'; ctx.beginPath(); ctx.rect(px-3*s,py-30*s,6*s,30*s); ctx.fill();
    [[-25,-8],[25,-8],[-15,-20],[15,-20],[0,-25]].forEach(([fx,fy])=>{
      ctx.fillStyle='#2A7020'; ctx.beginPath();
      ctx.ellipse(px+fx*s,py+fy*s,16*s,6*s,Math.atan2(fy,fx),0,Math.PI*2); ctx.fill();
    });
  }
  palm(w*0.12,h*0.42); palm(w*0.88,h*0.40); palm(w*0.30,h*0.41);
  // sand
  const sandG=ctx.createLinearGradient(0,h*0.40,0,h*0.48);
  sandG.addColorStop(0,'#E8C880'); sandG.addColorStop(1,'#D8B860');
  ctx.fillStyle=sandG; ctx.fillRect(0,h*0.40,w,h*0.08);
  const poly=getLakePoly(2);
  drawWater(w,h,poly,'#20C8E0','#0888A8',t);
}

function drawVltava(w, h, t) {
  drawSky(w,h,'#9090A8','#C0C8D8',1.0);
  const s=sc();
  // Charles Bridge
  ctx.fillStyle='#8A7060';
  ctx.beginPath(); ctx.rect(0,h*0.33,w,h*0.06); ctx.fill();
  // arches
  ctx.fillStyle='#7A6050';
  for(let i=0;i<7;i++){
    const bx=w*(0.05+i*0.14);
    ctx.beginPath(); ctx.arc(bx,h*0.39,w*0.05,0,Math.PI,true); ctx.fill();
  }
  // statues on bridge
  ctx.fillStyle='#6A6060';
  for(let i=0;i<6;i++){
    const bx=w*(0.10+i*0.16);
    ctx.beginPath(); ctx.rect(bx-4*s,h*0.30,8*s,h*0.04); ctx.fill();
    ctx.beginPath(); ctx.arc(bx,h*0.29,5*s,0,Math.PI*2); ctx.fill();
  }
  // Prague Castle / cathedral silhouette
  ctx.fillStyle='#5A5870';
  ctx.beginPath(); ctx.rect(w*0.55,h*0.08,w*0.40,h*0.26); ctx.fill();
  ctx.fillStyle='#4A4860';

// MAP SCREEN
// ═══════════════════════════════════════════════════════════════
function drawMapScreen() {
  const mc = document.getElementById('mapCanvas');
  const mctx = mc.getContext('2d');
  const mw = mc.width, mh = mc.height;
  mctx.clearRect(0,0,mw,mh);

  // Ocean background
  const og = mctx.createLinearGradient(0,0,0,mh);
  og.addColorStop(0,'#2A6A9A'); og.addColorStop(1,'#1A4A7A');
  mctx.fillStyle=og; mctx.fillRect(0,0,mw,mh);

  // Rough continent outlines (simplified world)
  mctx.fillStyle='#4A7A48';
  // North America
  mctx.beginPath(); mctx.moveTo(mw*0.05,mh*0.15); mctx.lineTo(mw*0.22,mh*0.10);
  mctx.lineTo(mw*0.28,mh*0.35); mctx.lineTo(mw*0.20,mh*0.55); mctx.lineTo(mw*0.08,mh*0.50);
  mctx.closePath(); mctx.fill();
  // South America
  mctx.beginPath(); mctx.moveTo(mw*0.18,mh*0.55); mctx.lineTo(mw*0.28,mh*0.52);
  mctx.lineTo(mw*0.30,mh*0.85); mctx.lineTo(mw*0.18,mh*0.90); mctx.lineTo(mw*0.12,mh*0.70);
  mctx.closePath(); mctx.fill();
  // Europe
  mctx.beginPath(); mctx.moveTo(mw*0.44,mh*0.15); mctx.lineTo(mw*0.58,mh*0.12);
  mctx.lineTo(mw*0.60,mh*0.35); mctx.lineTo(mw*0.46,mh*0.38); mctx.closePath(); mctx.fill();
  // Africa
  mctx.beginPath(); mctx.moveTo(mw*0.46,mh*0.38); mctx.lineTo(mw*0.60,mh*0.36);
  mctx.lineTo(mw*0.58,mh*0.72); mctx.lineTo(mw*0.48,mh*0.78); mctx.lineTo(mw*0.42,mh*0.60);
  mctx.closePath(); mctx.fill();
  // Asia
  mctx.beginPath(); mctx.moveTo(mw*0.58,mh*0.12); mctx.lineTo(mw*0.95,mh*0.10);
  mctx.lineTo(mw*0.95,mh*0.50); mctx.lineTo(mw*0.62,mh*0.48); mctx.lineTo(mw*0.58,mh*0.35);
  mctx.closePath(); mctx.fill();

  // Title
  mctx.fillStyle='rgba(255,255,255,0.9)';
  mctx.font='bold 11px Georgia'; mctx.textAlign='center';
  mctx.fillText('Sydney & Michael\'s Adventure Map', mw*0.5, 14);

  // Draw visited dots with lines between them
  const visited = visitedLevels.map(i => {
    const lvl = i < LEVELS.length ? LEVELS[i] : null;
    return lvl ? [mw*lvl.mapDot[0], mh*lvl.mapDot[1]] : null;
  }).filter(Boolean);

  if (visited.length > 1) {
    mctx.strokeStyle='rgba(255,200,50,0.7)';
    mctx.lineWidth=1.5; mctx.setLineDash([3,3]);
    mctx.beginPath(); mctx.moveTo(visited[0][0],visited[0][1]);
    for(let i=1;i<visited.length;i++) mctx.lineTo(visited[i][0],visited[i][1]);
    mctx.stroke(); mctx.setLineDash([]);
  }

  visitedLevels.forEach((li, idx) => {
    if (li >= LEVELS.length) return;
    const lvl = LEVELS[li];
    const [px,py] = [mw*lvl.mapDot[0], mh*lvl.mapDot[1]];
    const isLast = idx === visitedLevels.length-1;
    mctx.fillStyle = isLast ? '#FFD700' : '#FF8040';
    mctx.beginPath(); mctx.arc(px,py,isLast?7:5,0,Math.PI*2); mctx.fill();
    mctx.strokeStyle='white'; mctx.lineWidth=1.5;
    mctx.beginPath(); mctx.arc(px,py,isLast?7:5,0,Math.PI*2); mctx.stroke();
    // label
    mctx.fillStyle='white'; mctx.font=`${isLast?'bold ':' '}9px Georgia`;
    mctx.textAlign='center';
    mctx.fillText(lvl.name.split(' ').slice(-1)[0], px, py-9);
  });
}

  gamePhase = 'levelcomplete';
  playLevelCompleteSound();

  if (!visitedLevels.includes(currentLevel)) visitedLevels.push(currentLevel);
  persist();
  drawMapScreen();

  const lvl = getLevelDef();
  document.getElementById('pc-stamp').textContent = lvl.stamp;
  document.getElementById('pc-title').textContent = lvl.name;
  document.getElementById('pc-sub').textContent = lvl.sub;
  document.getElementById('pc-fact').textContent = lvl.fact;

  const nextLvl = currentLevel + 1;
  const nextBtn = document.getElementById('nextLvlBtn');
  if (nextLvl < LEVELS.length) {
    nextBtn.textContent = `Next: ${LEVELS[nextLvl].name} →`;
  } else {
    nextBtn.textContent = `Bonus Round! ✨ →`;
  }

  document.getElementById('overlay').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════════
// PHYSICS UPDATE
// ═══════════════════════════════════════════════════════════════
const TURN_SPEED=2.0, ACCEL_BASE=160, ACCEL_MAX=600, ACCEL_RAMP=2.8;
const DRAG=0.88, ANGULAR_DRAG=0.80;

function update(dt, t) {
  if (gamePhase !== 'playing') return;
  waterTime=t;
  const up=isKey('ArrowUp','w','W','up');
  const down=isKey('ArrowDown','s','S','down');
  const left=isKey('ArrowLeft','a','A','left');
  const right=isKey('ArrowRight','d','D','right');
  const moving=up||down;

  holdTime = up ? Math.min(holdTime+dt,ACCEL_RAMP) : Math.max(holdTime-dt*4,0);
  holdTimeBack = down ? Math.min(holdTimeBack+dt,ACCEL_RAMP) : Math.max(holdTimeBack-dt*4,0);

  const t01=holdTime/ACCEL_RAMP, t01b=holdTimeBack/ACCEL_RAMP;
  const accel=ACCEL_BASE+(ACCEL_MAX-ACCEL_BASE)*(t01*t01);
  const accelBack=ACCEL_BASE+(ACCEL_MAX-ACCEL_BASE)*(t01b*t01b);

  if(left) kayak.vAngle-=TURN_SPEED*dt;
  if(right) kayak.vAngle+=TURN_SPEED*dt;
  if(up){ kayak.vx+=Math.cos(kayak.angle)*accel*dt; kayak.vy+=Math.sin(kayak.angle)*accel*dt; kayak.paddlePhase+=(4+t01*8)*dt; }
  if(down){ kayak.vx-=Math.cos(kayak.angle)*accelBack*dt; kayak.vy-=Math.sin(kayak.angle)*accelBack*dt; kayak.paddlePhase-=(4+t01b*8)*dt; }

  kayak.vx*=Math.pow(DRAG,dt*60); kayak.vy*=Math.pow(DRAG,dt*60);
  kayak.vAngle*=Math.pow(ANGULAR_DRAG,dt*60);
  kayak.angle+=kayak.vAngle;

  const nx=kayak.x+kayak.vx*dt, ny=kayak.y+kayak.vy*dt;
  if(isInLake(nx,kayak.y)) kayak.x=nx; else { kayak.vx*=-0.3; holdTime=0; holdTimeBack=0; }
  if(isInLake(kayak.x,ny)) kayak.y=ny; else { kayak.vy*=-0.3; holdTime=0; holdTimeBack=0; }

  const speed=Math.hypot(kayak.vx,kayak.vy);
  if(moving&&speed>15&&Math.random()<dt*(4+t01*8)) addRipple(kayak.x,kayak.y);

  const soundInt=Math.max(0.12,0.35-t01*0.2);
  if(moving&&t-lastPaddleSound>soundInt){ playPaddleSound(); lastPaddleSound=t; }

  let collectedCount=0;
  collectibles.forEach(c=>{
    if(c.collected){ c.fadeOut=(c.fadeOut||0)+dt*2; collectedCount++; return; }
    if(Math.hypot(c.x-kayak.x,c.y-kayak.y)<22*sc()){
      c.collected=true; c.fadeOut=0;
      totalScore++;
      collectedCount++;
      document.getElementById('colDisplay').textContent = collectedCount;
      persist();
      addSplash(c.x,c.y); playCollectSound();
    }
  });

  // Level complete when all non-fading collected
  if(collectibles.length>0 && collectibles.every(c=>c.collected) && gamePhase==='playing'){
    setTimeout(showLevelComplete, 600);
    gamePhase='completing';
  }

  updateRipples(dt); updateSplash(dt);
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function render(t) {
  const w=W(), h=H();
  ctx.clearRect(0,0,w,h);
  const lvl=getLevelDef();
  lvl.drawScene(w,h,t);
  drawRipples(); drawSplash();
  drawCollectibles(t);
  drawKayak(kayak.x,kayak.y,kayak.angle,kayak.paddlePhase);
}

// ═══════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════
let lastTime=null;
function loop(ts) {
  const t=ts/1000;
  const dt=lastTime===null?0.016:Math.min(t-lastTime,0.05);
  lastTime=t;
  update(dt,t);
  render(t);
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════
// BUTTON WIRING
// ═══════════════════════════════════════════════════════════════
document.getElementById('newGameBtn').addEventListener('click', () => initLevel(true));
document.getElementById('nextLvlBtn').addEventListener('click', () => {
  currentLevel++;
  persist();
  initLevel(false);
});
document.getElementById('replayBtn').addEventListener('click', () => initLevel(false));

// ═══════════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════════
initLevel(false);
requestAnimationFrame(loop);
</script>
</body>
