<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sydney & Michael's Kayak Adventures 🛶</title>
<link rel="stylesheet" href="../shared/reset.css">
<link rel="stylesheet" href="kayak.css">
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="lbl">Collected</div>
    <div class="sc"><span id="colDisplay">0</span> / <span id="colTotal">9</span></div>
    <div class="best">Best: <span id="highScoreDisplay">0</span></div>
    <button id="newGameBtn">New Game</button>
    <div id="version-display"></div>
  </div>

  <div id="lvlBanner">🛶 Level 1 · Parque Jaime Duque</div>

  <!-- Overlay (postcard + map) -->
  <div id="overlay" class="hidden">
    <canvas id="mapCanvas" width="340" height="220"></canvas>
    <div style="height:12px"></div>
    <div class="postcard" id="postcard">
      <div class="stamp" id="pc-stamp">🏝️</div>
      <div class="pc-title" id="pc-title">Location</div>
      <div class="pc-sub" id="pc-sub">Colombia</div>
      <div class="pc-fact" id="pc-fact">Fun fact here.</div>
      <div class="pc-love" id="pc-love">💕 Sydney & Michael were here</div>
      <button id="nextLvlBtn">Next Destination →</button>
      <button class="sec" id="replayBtn">Replay Level</button>
    </div>
  </div>

  <!-- Dev level jump -->
  <div id="levelJump" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);border:2px solid #8B6914;border-radius:8px;padding:16px 20px;color:#fff;font-family:Georgia,serif;z-index:100;text-align:center;">
    <div style="margin-bottom:8px;font-size:14px;">Go to level:</div>
    <input id="levelJumpInput" type="number" min="1" max="12" style="width:60px;font-size:18px;text-align:center;border-radius:4px;border:1px solid #8B6914;padding:4px;">
    <button id="levelJumpGo" style="margin-left:8px;padding:5px 12px;background:#8B6914;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;">Go</button>
  </div>

  <!-- D-Pad -->
  <div id="dpad">
    <div></div>
    <div class="dpad-btn" id="btn-up" style="grid-column:2;grid-row:1">▲</div>
    <div></div>
    <div class="dpad-btn" id="btn-left" style="grid-column:1;grid-row:2">◀</div>
    <div class="dpad-center" style="grid-column:2;grid-row:2"></div>
    <div class="dpad-btn" id="btn-right" style="grid-column:3;grid-row:2">▶</div>
    <div></div>
    <div class="dpad-btn" id="btn-down" style="grid-column:2;grid-row:3">▼</div>
    <div></div>
  </div>
</div>

<script src="kayak.js"></script>
<script>
  document.getElementById('version-display').textContent = `v${GAME_VERSION}`;
</script>
<script src="physics.js"></script>
<script src="renderer.js"></script>
<script src="levels.js"></script>
<script>
  initLevel(false);
  requestAnimationFrame(loop);

  function doLevelJump() {
    const n = parseInt(document.getElementById('levelJumpInput').value, 10);
    if (!isNaN(n) && n >= 1 && n <= LEVELS.length) {
      currentLevel = n - 1;
      initLevel(false);
    }
    document.getElementById('levelJump').style.display = 'none';
  }
  document.getElementById('levelJumpGo').addEventListener('click', doLevelJump);
  document.getElementById('levelJumpInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLevelJump();
    if (e.key === 'Escape') document.getElementById('levelJump').style.display = 'none';
    e.stopPropagation();
  });
</script>
</body>
</html>
