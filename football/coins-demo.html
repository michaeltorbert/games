<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game-day coins · Preview examples</title><link rel="stylesheet" href="../shared/reset.css"><link rel="stylesheet" href="football.css"><style>
html,body{height:auto;min-height:100%;overflow:auto}body{margin:0;background:#071d31;color:#fff;font-family:Arial,sans-serif}.coin-preview{width:min(920px,100%);margin:0 auto;padding:18px;box-sizing:border-box}h1{font-size:28px;margin:0 0 8px}.preview-note{font-size:14px;line-height:1.4;color:#ccdbe4;margin-bottom:16px}.preview-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}select,button{font:700 16px Arial;min-height:44px;border-radius:8px;border:1px solid #8393a4;padding:9px 12px}select{min-width:0;flex:1;width:100%}button{cursor:pointer;background:#f4c95d;color:#102739}.preview-field{padding:16px;background:repeating-linear-gradient(90deg,#164b3d 0px,#164b3d 85px,#205b48 86px,#205b48 88px);border:2px solid #456d5d;border-radius:12px}.preview-desk{background:#102d47;padding:16px;border-radius:12px;border:1px solid #5a7992}.preview-desk h2{font-size:20px;line-height:1.35;margin:0 0 12px}.preview-coins{padding:10px;background:#0b2238;border-radius:9px;text-align:center;min-height:65px}.preview-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.preview-choices button{min-height:64px;background:#fff;color:#15344a}.preview-choices button.correct{background:#b1e6be}.preview-choices button.wrong{background:#f1b6ae}.preview-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}#demo-feedback{font-size:15px;line-height:1.4;margin-top:12px;min-height:24px}#demo-source{font-size:12px;color:#bad0df;margin-top:12px}.preview-stage{font-weight:700;color:#f4c95d;margin-bottom:8px}@media(max-width:500px){.coin-preview{padding:10px}.preview-field,.preview-desk{padding:10px}h1{font-size:23px}.preview-desk h2{font-size:17px}.preview-nav{display:grid;grid-template-columns:1fr auto}.preview-nav select{grid-column:1/-1}.preview-note{font-size:12px}}
</style></head><body><main class="coin-preview"><h1>Game-day coins</h1><p class="preview-note">Preview examples · Pretend shop, practice prices. Try every new coin question and its help. These examples use pretend completed pages; nothing is saved to a learner’s progress, play history, or Season.</p><nav class="preview-nav" aria-label="Choose an example"><select id="demo-family" aria-label="Coin question type"></select><button id="demo-next">Next type →</button><span id="demo-count"></span></nav><section class="preview-field"><div class="preview-desk"><div class="preview-stage" id="demo-stage"></div><h2 id="demo-question"></h2><div class="preview-coins" id="demo-visual"></div><div class="preview-choices" id="demo-choices"></div><p id="demo-feedback" role="status"></p><div class="preview-actions"><button id="demo-help">Show help</button><button id="demo-worked">Show worked answer</button><button id="demo-again">Try again</button></div><p id="demo-source"></p></div></section></main><script src="../shared/curriculum.js"></script><script src="opponent.js"></script><script src="football-domain.js"></script><script src="copy.js"></script><script src="contextual-questions.js"></script><script src="coins-view.js"></script><script src="coins-demo.js"></script></body></html>
