<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Football Math!</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.7.0">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=1.7.0">
<link rel="stylesheet" href="../shared/fonts.css?v=1.7.0">
<link rel="stylesheet" href="../shared/reset.css?v=1.7.0">
<link rel="stylesheet" href="football.css?v=1.7.0">
</head>
<body>
<div id="wrap">
  <div id="status">
    <div class="stat">
      <div class="stat-label">Down &amp; Distance</div>
      <div class="stat-value" id="s-down">1st &amp; 10</div>
    </div>
    <div class="stat">
      <div class="stat-label">Yard Line</div>
      <div class="stat-value" id="s-yd">20</div>
    </div>
    <div class="stat">
      <div class="stat-label">Quarter</div>
      <div class="stat-value" id="s-quarter">Q1</div>
    </div>
    <div class="stat">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="s-score">0 - 0</div>
    </div>
  </div>

  <div id="field-wrap">
    <div class="ez-text ez-left" style="color:#003087">DUKE</div>
    <div class="ez-text ez-right" style="color:#7BAFD4">CAROLINA</div>
    <div id="fd-line"></div>
    <div id="ball" aria-hidden="true">
      <svg viewBox="-34 -22 68 44" role="img">
        <ellipse cx="0" cy="0" rx="30" ry="18" />
        <path class="ball-seam" d="M-21 -2 C-9 -11 9 -11 21 -2" />
        <path class="ball-lace-main" d="M-8 -6 L9 6" />
        <path class="ball-lace" d="M-4 -10 L12 1" />
        <path class="ball-lace" d="M-10 -1 L5 10" />
      </svg>
    </div>
  </div>

  <div id="play-label">Get ready…</div>
  <div id="question"></div>
  <div id="call-grid" class="hidden"></div>
  <div id="btn-row">
    <button class="ans-btn" id="b0" onclick="handleAnswer(0)">–</button>
    <button class="ans-btn" id="b1" onclick="handleAnswer(1)">–</button>
    <button class="ans-btn" id="b2" onclick="handleAnswer(2)">–</button>
    <button class="ans-btn" id="b3" onclick="handleAnswer(3)">–</button>
  </div>
  <div id="feedback"></div>
  <div id="version-display"></div>
</div>

<div class="overlay show" id="ov-start">
  <div class="ov-emoji">🏈</div>
  <div class="ov-title">Football Math!</div>
  <div class="ov-sub">Call plays, answer math, and win in 4 quarters.</div>
  <button class="ov-btn" onclick="startGame()">Start Game</button>
</div>
<div class="overlay" id="ov-td">
  <div class="ov-emoji">🏆</div>
  <div class="ov-title">TOUCHDOWN!</div>
  <div class="ov-sub" id="ov-td-sub"></div>
  <button class="ov-btn" id="ov-td-btn" onclick="afterTouchdown()">Play Defense!</button>
</div>
<div class="overlay" id="ov-defense">
  <div class="ov-emoji">🛡️</div>
  <div class="ov-title">Opponent's Ball!</div>
  <div class="ov-sub" id="ov-defense-sub"></div>
  <button class="ov-btn" onclick="startDefense()">Play Defense!</button>
</div>
<div class="overlay" id="ov-offense">
  <div class="ov-emoji">🏈</div>
  <div class="ov-title">Your Ball!</div>
  <div class="ov-sub" id="ov-offense-sub"></div>
  <button class="ov-btn" onclick="startOffense()">Play Offense!</button>
</div>
<div class="overlay" id="ov-quarter">
  <div class="ov-emoji">📣</div>
  <div class="ov-title" id="ov-quarter-title">End of Quarter</div>
  <div class="ov-sub" id="ov-quarter-sub"></div>
  <button class="ov-btn" onclick="nextQuarter()">Next Quarter</button>
</div>
<div class="overlay" id="ov-halftime">
  <div class="ov-emoji">🥤</div>
  <div class="ov-title">HALFTIME!</div>
  <div class="ov-sub" id="ov-halftime-sub"></div>
  <button class="ov-btn" onclick="nextQuarter()">2nd Half!</button>
</div>
<div class="overlay" id="ov-end">
  <div class="ov-emoji" id="ov-end-emoji">⭐</div>
  <div class="ov-title" id="ov-end-title">Final Score</div>
  <div class="ov-sub" id="ov-end-sub"></div>
  <button class="ov-btn" onclick="restart()">Play Again!</button>
</div>

<script src="football.js?v=1.7.0"></script>
<script>
  document.getElementById('version-display').textContent = `v${GAME_VERSION}`;
</script>
<script src="../shared/updater.js?v=1.7.0"></script>
</body>
</html>
