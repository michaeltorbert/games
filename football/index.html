<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Football Math!</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.12.0">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=1.12.0">
<link rel="stylesheet" href="../shared/fonts.css?v=1.12.0">
<link rel="stylesheet" href="../shared/reset.css?v=1.12.0">
<link rel="stylesheet" href="football.css?v=1.12.0">
</head>
<body>
<div id="wrap">
  <div id="status">
    <div class="sb-team sb-duke"><span class="sb-name">DUKE</span><span class="sb-score" id="s-pscore">0</span></div>
    <div class="sb-team sb-unc"><span class="sb-name">UNC</span><span class="sb-score" id="s-oscore">0</span></div>
    <div class="sb-divider"></div>
    <div class="sb-info">
      <span class="sb-label">QTR</span><span class="sb-val" id="s-quarter">1</span>
    </div>
    <div class="sb-info">
      <span class="sb-label">DOWN</span><span class="sb-val" id="s-down">1st &amp; 10</span>
    </div>
    <div class="sb-info">
      <span class="sb-label">BALL ON</span><span class="sb-val" id="s-yd">own 20</span>
    </div>
    <div id="sb-poss" class="sb-poss" aria-label="Possession">&#9654;</div>
  </div>

  <div id="field-wrap">
    <div class="ez-text ez-left" style="color:#003087">DUKE</div>
    <div class="ez-text ez-right" style="color:#7BAFD4">CAROLINA</div>
    <div id="fd-line"></div>
    <div id="ball" aria-hidden="true">
      <svg viewBox="-34 -22 68 44" role="img">
        <ellipse cx="0" cy="0" rx="30" ry="18" />
        <path class="ball-seam" d="M-21 -2 C-9 -11 9 -11 21 -2" />
        <path class="ball-lace-main" d="M-8 -6 L9 6" />
        <path class="ball-lace" d="M-4 -10 L12 1" />
        <path class="ball-lace" d="M-10 -1 L5 10" />
      </svg>
    </div>
    <div id="player" class="player-hidden" aria-hidden="true">
      <svg viewBox="0 0 20 32">
        <ellipse cx="10" cy="5" rx="5" ry="4.5" fill="#fff" stroke="#ccc" stroke-width="0.5"/>
        <rect x="14" y="3.5" width="2" height="2.5" rx="0.5" fill="#999"/>
        <rect x="5" y="9" width="10" height="10" rx="1.5" fill="#003087"/>
        <line class="pl-arm-l" x1="5" y1="11" x2="2" y2="16" stroke="#003087" stroke-width="2.5" stroke-linecap="round"/>
        <line class="pl-arm-r" x1="15" y1="11" x2="18" y2="16" stroke="#003087" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="6.5" y="18.5" width="7" height="4" rx="1" fill="#fff"/>
        <line class="pl-leg-l" x1="8.5" y1="22" x2="7" y2="29" stroke="#003087" stroke-width="2" stroke-linecap="round"/>
        <line class="pl-leg-r" x1="11.5" y1="22" x2="13" y2="29" stroke="#003087" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div id="play-label">Get ready…</div>
  <div id="question"></div>
  <div id="call-grid" class="hidden"></div>
  <div id="btn-row">
    <button class="ans-btn" id="b0" onclick="handleAnswer(0)">–</button>
    <button class="ans-btn" id="b1" onclick="handleAnswer(1)">–</button>
    <button class="ans-btn" id="b2" onclick="handleAnswer(2)">–</button>
    <button class="ans-btn" id="b3" onclick="handleAnswer(3)">–</button>
  </div>
  <div id="feedback"></div>
  <div id="version-display"></div>
</div>

<div class="overlay show" id="ov-start">
  <span class="ov-broadcast-badge ov-badge-info">KICKOFF</span>
  <div class="ov-title">Football Math!</div>
  <div class="ov-sub">Call plays, answer math, and win in 4 quarters.</div>
  <button class="ov-btn" onclick="startGame()">Start Game</button>
</div>
<div class="overlay" id="ov-td">
  <div class="ov-confetti" id="ov-td-confetti"></div>
  <span class="ov-broadcast-badge">TOUCHDOWN</span>
  <div class="ov-title">TOUCHDOWN!</div>
  <div class="ov-sub" id="ov-td-sub"></div>
  <button class="ov-btn" id="ov-td-btn" onclick="afterTouchdown()">Play Defense!</button>
</div>
<div class="overlay" id="ov-defense">
  <span class="ov-broadcast-badge ov-badge-defense">DEFENSE</span>
  <div class="ov-title">Opponent's Ball!</div>
  <div class="ov-sub" id="ov-defense-sub"></div>
  <button class="ov-btn" onclick="startDefense()">Play Defense!</button>
</div>
<div class="overlay" id="ov-offense">
  <span class="ov-broadcast-badge ov-badge-info">OFFENSE</span>
  <div class="ov-title">Your Ball!</div>
  <div class="ov-sub" id="ov-offense-sub"></div>
  <button class="ov-btn" onclick="startOffense()">Play Offense!</button>
</div>
<div class="overlay" id="ov-quarter">
  <span class="ov-broadcast-badge ov-badge-info">BREAK</span>
  <div class="ov-title" id="ov-quarter-title">End of Quarter</div>
  <div class="ov-sub" id="ov-quarter-sub"></div>
  <button class="ov-btn" onclick="nextQuarter()">Next Quarter</button>
</div>
<div class="overlay" id="ov-halftime">
  <span class="ov-broadcast-badge ov-badge-info">HALFTIME</span>
  <div class="ov-title">HALFTIME!</div>
  <div class="ov-sub" id="ov-halftime-sub"></div>
  <button class="ov-btn" onclick="nextQuarter()">2nd Half!</button>
</div>
<div class="overlay" id="ov-end">
  <div class="ov-confetti" id="ov-end-confetti"></div>
  <span class="ov-broadcast-badge" id="ov-end-badge">FINAL</span>
  <div class="ov-title" id="ov-end-title">Final Score</div>
  <div class="ov-final-score" id="ov-end-score"></div>
  <div class="ov-sub" id="ov-end-sub"></div>
  <button class="ov-btn" onclick="restart()">Play Again!</button>
</div>

<script src="football.js?v=1.12.0"></script>
<script>
  document.getElementById('version-display').textContent = `v${GAME_VERSION}`;
</script>
<script src="../shared/updater.js?v=1.12.0"></script>
</body>
</html>
