<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>James's Place Value Practice</title><style>
:root{--ink:#22231f;--muted:#66685f;--line:#d8d3c6;--paper:#fff;--page:#f5f1e7;--green:#355d4a;--bad:#8a3f35}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,sans-serif}.app{width:min(760px,100%);margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:clamp(1.3rem,5vw,2rem);margin:0}.status{font-weight:800;color:var(--muted)}.bar{height:8px;background:#ddd9cf;border-radius:99px;margin:12px 0 16px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--green);width:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px #00000012}.card h2{text-align:center;margin:0;font-size:clamp(1.45rem,6vw,2.25rem)}.sub{text-align:center;color:var(--muted);margin:5px 0 15px}.blocks{min-height:245px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000008 1px,transparent 1px),#fbfaf6;background-size:24px 24px;padding:20px 12px;display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap}.group{display:flex;align-items:flex-end;justify-content:center;gap:7px;flex-wrap:wrap}.hundreds{max-width:330px}.tens{max-width:230px}.ones{display:grid;grid-template-columns:repeat(3,32px);gap:6px}.block{display:block}.answer{display:flex;gap:10px;justify-content:center;margin:18px auto 8px;max-width:500px}.answer input{width:100%;height:74px;border:3px solid #99998f;border-radius:18px;text-align:center;font-size:2.5rem;font-weight:850}.answer button,.next{border:0;border-radius:16px;background:var(--green);color:white;font-weight:850;font-size:1.2rem;padding:0 25px;min-height:64px}.feedback{min-height:52px;text-align:center;font-weight:800;font-size:1.08rem;padding:8px;color:var(--bad)}.feedback.good{color:var(--green)}.hint{display:none;background:#fbf3df;border-radius:14px;padding:12px;text-align:center;margin-top:6px;font-weight:700}.hint.show{display:block}.next{display:none;margin:8px auto}.next.show{display:block}.legend{text-align:center;color:var(--muted);font-size:.9rem;margin-top:10px}.summary{display:none;text-align:center}.summary.show{display:block}.summary h2{font-size:2rem}.summary button{border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:800;padding:15px 22px;font-size:1.1rem}@media(max-width:520px){.app{padding:8px}.card{padding:14px 10px}.blocks{min-height:220px;padding:15px 6px;gap:7px}.answer{flex-direction:column}.answer button{min-height:58px}.hundreds svg{width:128px!important;height:128px!important}.tens svg{height:112px!important}.ones{grid-template-columns:repeat(3,29px)}}
</style></head><body><main class="app"><div class="top"><h1>Hundreds, Tens, and Ones</h1><div class="status" id="status">1 of 10</div></div><div class="bar"><i id="progress"></i></div><section class="card" id="practice"><h2>What number do the blocks show?</h2><p class="sub">Count the hundred-flats, ten-rods, and one-cubes.</p><div class="blocks" id="blocks"></div><div class="answer"><input id="answer" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Answer"><button id="check">Check</button></div><div class="feedback" id="feedback"></div><div class="hint" id="hint"></div><button class="next" id="next">Next</button><div class="legend">A flat is 100. A rod is 10. A cube is 1.</div></section><section class="card summary" id="summary"><h2>Session complete</h2><p id="score"></p><p id="needs"></p><button id="again">Practice again</button></section></main><script>
const $=s=>document.querySelector(s),N=10;let i=0,first=0,after=0,q=null,tries=0,recent=[],miss={zeroTens:0,zeroOnes:0,all:0};
function svg(tag,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function flat(){const s=svg('svg',{viewBox:'0 0 110 110',width:145,height:145,class:'block'});s.append(svg('rect',{x:4,y:4,width:102,height:102,fill:'#f7f4e8',stroke:'#292a27','stroke-width':3}));for(let j=1;j<10;j++){s.append(svg('line',{x1:4,y1:4+j*10.2,x2:106,y2:4+j*10.2,stroke:'#666','stroke-width':1}));s.append(svg('line',{x1:4+j*10.2,y1:4,x2:4+j*10.2,y2:106,stroke:'#666','stroke-width':1}))}return s}
function rod(){const s=svg('svg',{viewBox:'0 0 28 112',width:28,height:126,class:'block'});s.append(svg('rect',{x:3,y:4,width:22,height:104,fill:'#f7f4e8',stroke:'#292a27','stroke-width':2.5}));for(let j=1;j<10;j++)s.append(svg('line',{x1:3,y1:4+j*10.4,x2:25,y2:4+j*10.4,stroke:'#666','stroke-width':1}));return s}
function cube(){const s=svg('svg',{viewBox:'0 0 34 34',width:32,height:32,class:'block'});s.append(svg('rect',{x:6,y:7,width:22,height:22,fill:'#f7f4e8',stroke:'#292a27','stroke-width':2.4}));s.append(svg('path',{d:'M6 7l5-4h20l-3 4M28 7l3-4v21l-3 5',fill:'none',stroke:'#666','stroke-width':1.3}));return s}
function choose(){let pool;if(i<4)pool=['all','zeroTens','zeroOnes','all'];else pool=['all','zeroTens','zeroOnes','all','exactHundred'];let type=pool[Math.floor(Math.random()*pool.length)],h=1,t=0,o=0;if(type==='zeroTens')o=1+Math.floor(Math.random()*9);else if(type==='zeroOnes')t=1+Math.floor(Math.random()*9);else if(type==='exactHundred'){h=1+Math.floor(Math.random()*3)}else{t=1+Math.floor(Math.random()*4);o=1+Math.floor(Math.random()*9)}let value=100*h+10*t+o,c=0;while(recent.includes(value)&&c++<30){o=type==='zeroOnes'?0:1+Math.floor(Math.random()*9);t=type==='zeroTens'||type==='exactHundred'?0:1+Math.floor(Math.random()*4);value=100*h+10*t+o}recent.push(value);if(recent.length>8)recent.shift();return{h,t,o,value,type}}
function render(){q=choose();tries=0;$('#feedback').textContent='';$('#feedback').className='feedback';$('#hint').className='hint';$('#next').className='next';$('#answer').value='';$('#answer').disabled=false;$('#check').disabled=false;$('#status').textContent=`${i+1} of ${N}`;$('#progress').style.width=`${i/N*100}%`;const b=$('#blocks');b.innerHTML='';for(const [cls,n,maker]of[['hundreds',q.h,flat],['tens',q.t,rod],['ones',q.o,cube]])if(n){const g=document.createElement('div');g.className='group '+cls;for(let x=0;x<n;x++)g.append(maker());b.append(g)}setTimeout(()=>$('#answer').focus(),50)}
function check(){const raw=$('#answer').value.trim();if(!/^\d{1,3}$/.test(raw)){feedback('Enter a whole number from 0 to 999.');return}tries++;if(+raw===q.value){if(tries===1)first++;else after++;$('#feedback').className='feedback good';$('#feedback').textContent=`Correct. ${q.h} hundred${q.h===1?'':'s'}, ${q.t} ten${q.t===1?'':'s'}, and ${q.o} one${q.o===1?'':'s'} make ${q.value}.`;$('#answer').disabled=true;$('#check').disabled=true;$('#next').className='next show';return}if(q.type in miss)miss[q.type]++;if(tries===1)feedback('Look again. Count only the blocks that are actually shown. No rod means zero tens.');else{feedback('Use the place values below, then try again.');$('#hint').className='hint show';$('#hint').textContent=`${q.h} × 100 = ${q.h*100}   •   ${q.t} × 10 = ${q.t*10}   •   ${q.o} × 1 = ${q.o}`}}
function feedback(t){$('#feedback').textContent=t;$('#answer').select()}
function next(){i++;if(i>=N)return finish();render()}
function finish(){$('#practice').style.display='none';$('#summary').className='card summary show';$('#progress').style.width='100%';$('#status').textContent='Finished';$('#score').textContent=`${first} correct on the first try; ${after} correct after help.`;const entries=Object.entries(miss).sort((a,b)=>b[1]-a[1]);const name={zeroTens:'numbers with zero tens, such as 104',zeroOnes:'numbers with zero ones, such as 120',all:'numbers using all three places, such as 128'};$('#needs').textContent=entries[0][1]?`Most practice needed: ${name[entries[0][0]]}.`:'No repeated difficulty appeared in this session.'}
function restart(){i=first=after=0;recent=[];miss={zeroTens:0,zeroOnes:0,all:0};$('#summary').className='card summary';$('#practice').style.display='block';render()}
$('#check').onclick=check;$('#next').onclick=next;$('#again').onclick=restart;$('#answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('#next').classList.contains('show')?next():check()});$('#answer').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,3));render();
</script></body></html>
