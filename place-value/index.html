<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Place Value Blocks</title>
<style>
:root{--bg:#f4f1e8;--card:#fff;--ink:#20211f;--muted:#696a64;--green:#355d4a;--soft:#e9f0eb;--line:#d8d5ca;--bad:#8b3f38;--good:#2f6a4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;padding:18px 14px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:clamp(1.35rem,5vw,2rem);margin:0}.gear{width:48px;height:48px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:23px}.status{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:18px 0}.badge{background:var(--soft);color:var(--green);font-weight:800;border-radius:999px;padding:8px 13px}.bar{height:10px;background:#ddd9d0;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--green);width:0;transition:.25s}.count{font-weight:700;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 36px #00000012;text-align:center}.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.15em;color:var(--green)}h2{font-size:clamp(1.55rem,5vw,2.35rem);margin:8px 0 4px}.sub{color:var(--muted);margin:0 0 16px}.scene{min-height:310px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000008 1px,transparent 1px),#fbfaf6;background-size:24px 24px;padding:18px;display:grid;place-items:center}.groups{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.group{min-height:245px;padding:10px 6px 34px;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid transparent;border-radius:14px}.group.hi{background:#fff6db;border-color:#bd965d}.items{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px}.hundreds .items{display:grid;grid-template-columns:repeat(3,minmax(45px,82px));gap:6px}.ones .items{display:grid;grid-template-columns:repeat(3,30px);gap:7px}.label{position:absolute;bottom:7px;left:0;right:0;font-weight:800;color:var(--muted)}.flat{aspect-ratio:1;width:100%;max-width:82px;border:2px solid #333;background:repeating-linear-gradient(0deg,transparent 0 calc(10% - 1px),#777 calc(10% - 1px) 10%),repeating-linear-gradient(90deg,#f8f3df 0 calc(10% - 1px),#777 calc(10% - 1px) 10%)}.rod{width:24px;height:160px;border:2px solid #333;background:repeating-linear-gradient(0deg,#edf3ee 0 calc(10% - 1px),#777 calc(10% - 1px) 10%)}.cube{width:30px;height:30px;border:2px solid #333;background:#f7ead0;box-shadow:3px -3px 0 #e7dcc6}.empty{width:80%;height:90px;border:2px dashed #d2cec2;border-radius:12px}.answer{margin:22px auto 0;max-width:520px}.answer input{width:min(260px,85vw);height:72px;border:3px solid #99978f;border-radius:16px;font-size:2.3rem;font-weight:850;text-align:center}.answer input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px #355d4a25}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}button{font:inherit;cursor:pointer}.primary,.secondary{min-height:56px;border-radius:15px;padding:0 30px;font-weight:850;font-size:1.15rem}.primary{border:0;background:var(--green);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.feedback{min-height:58px;margin-top:14px;font-size:1.05rem;font-weight:750}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.expanded{color:var(--muted);font-weight:650;margin-top:6px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px;z-index:10}.panel{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;text-align:left}.panel h3{margin-top:0}.row{display:grid;gap:7px;margin:14px 0}.row label{font-weight:800}.row select{height:48px;border:1px solid var(--line);border-radius:11px;padding:0 10px;background:#fff}.checkrow{display:flex;gap:10px;align-items:center;margin:12px 0}.summary{font-size:1.05rem;line-height:1.55}.small{font-size:.9rem;color:var(--muted)}@media(max-width:650px){.app{padding:12px 12px 24px}.groups{grid-template-columns:1fr;gap:5px}.group{min-height:185px}.group+.group{border-top:1px solid var(--line)}.hundreds .items{grid-template-columns:repeat(3,minmax(55px,74px))}.rod{height:120px}.scene{min-height:620px}.status{grid-template-columns:auto auto}.bar{grid-column:1/-1;grid-row:2}.card{padding:18px 12px}.label{font-size:.92rem}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>Hundreds, Tens, and Ones</h1><button class="gear" id="gear" aria-label="Settings">⚙</button></div>
<div class="status"><span class="badge" id="stageBadge">Stage 2</span><div class="bar"><div class="fill" id="fill"></div></div><span class="count" id="count">1 of 10</span></div>
<main class="card" id="card">
<div class="eyebrow">BLOCKS TO NUMBER</div><h2>What number do the blocks show?</h2><p class="sub">Count hundreds, then tens, then ones.</p>
<div class="scene"><div class="groups" id="groups"></div></div>
<div class="answer"><input id="answer" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Answer"><div class="buttons"><button class="primary" id="check">Check</button><button class="secondary hidden" id="next">Next</button></div><div class="feedback" id="feedback"></div><div class="expanded" id="expanded"></div></div>
</main>
</div>
<div class="modal hidden" id="modal"><div class="panel"><h3>Parent settings</h3>
<div class="row"><label for="mode">Practice plan</label><select id="mode"><option value="adaptive">Adaptive practice</option><option value="fixed">Choose a stage</option></select></div>
<div class="row"><label for="stage">Stage</label><select id="stage"><option value="2">2: One hundred with ones</option><option value="3">3: One hundred with tens</option><option value="4">4: All three places</option><option value="5">5: Special zero cases</option><option value="6">6: Multiple hundreds</option><option value="7">7: Mixed 0–999</option></select></div>
<div class="row"><label for="length">Session length</label><select id="length"><option>5</option><option selected>10</option><option>15</option><option>20</option><option value="0">Endless</option></select></div>
<label class="checkrow"><input type="checkbox" id="labels" checked> Show group labels</label>
<label class="checkrow"><input type="checkbox" id="expandedHelp" checked> Show expanded-form help</label>
<div class="buttons"><button class="primary" id="save">Save and restart</button><button class="secondary" id="close">Cancel</button><button class="secondary" id="reset">Reset progress</button></div>
<p class="small" id="savedStats"></p></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),groups=$('#groups'),answer=$('#answer'),feedback=$('#feedback'),expanded=$('#expanded'),check=$('#check'),next=$('#next'),modal=$('#modal');
const defaults={mode:'adaptive',stage:2,length:10,labels:true,expandedHelp:true,currentStage:2,total:0,first:0,skills:{zeroTens:[0,0],zeroOnes:[0,0],bothZero:[0,0],all:[0,0],multiple:[0,0]}};
let data=load(),q=null,index=0,session=[],attempts=0,locked=false,recent=[];
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem('placeValueData')||'{}')}}catch{return structuredClone(defaults)}}
function saveData(){localStorage.setItem('placeValueData',JSON.stringify(data))}
function digits(n){return {h:Math.floor(n/100),t:Math.floor(n/10)%10,o:n%10}}
function value(d){return d.h*100+d.t*10+d.o}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function stage(){return data.mode==='fixed'?Number(data.stage):data.currentStage}
function generate(){let s=stage(),d;for(let tries=0;tries<50;tries++){if(s===2)d={h:1,t:0,o:ri(1,9)};else if(s===3)d={h:1,t:ri(1,9),o:0};else if(s===4)d={h:1,t:ri(1,9),o:ri(1,9)};else if(s===5){let type=rand(['zt','zt','zt','zo','zo','both']);if(type==='zt')d={h:ri(1,5),t:0,o:ri(1,9)};if(type==='zo')d={h:ri(1,5),t:ri(1,9),o:0};if(type==='both')d={h:ri(1,9),t:0,o:0}}else if(s===6){let type=rand(['all','zt','zo','both']);d={h:ri(2,9),t:type==='zt'||type==='both'?0:ri(1,9),o:type==='zo'||type==='both'?0:ri(1,9)}}else{let n=ri(0,999);d=digits(n);if(Math.random()<.55){let type=rand(['zt','zo','both']);if(type==='zt')d.t=0;if(type==='zo')d.o=0;if(type==='both'){d.t=0;d.o=0}}}if(!recent.includes(value(d)))break}recent.push(value(d));recent=recent.slice(-10);return {d,s,tags:tags(d)}}
function tags(d){let a=[];if(d.t===0&&d.o===0)a.push('bothZero');else{if(d.t===0)a.push('zeroTens');if(d.o===0)a.push('zeroOnes')}if(d.h>1)a.push('multiple');if(d.h&&d.t&&d.o)a.push('all');return a}
function flat(){let e=document.createElement('div');e.className='flat';return e}function rod(){let e=document.createElement('div');e.className='rod';return e}function cube(){let e=document.createElement('div');e.className='cube';return e}
function group(name,n,make){let g=document.createElement('section');g.className='group '+name;g.dataset.place=name;let items=document.createElement('div');items.className='items';if(n===0){let e=document.createElement('div');e.className='empty';items.append(e)}else for(let i=0;i<n;i++)items.append(make());let l=document.createElement('div');l.className='label';l.textContent=data.labels?name:'';g.append(items,l);return g}
function render(){q=generate();attempts=0;locked=false;answer.value='';feedback.textContent='';feedback.className='feedback';expanded.textContent='';check.classList.remove('hidden');next.classList.add('hidden');groups.innerHTML='';groups.append(group('hundreds',q.d.h,flat),group('tens',q.d.t,rod),group('ones',q.d.o,cube));$('#stageBadge').textContent='Stage '+q.s;let len=Number(data.length);$('#count').textContent=len?`${index+1} of ${len}`:`Question ${index+1}`;$('#fill').style.width=len?`${index/len*100}%`:'35%';setTimeout(()=>answer.focus(),50)}
function phrase(n,w){return `${n} ${w}${n===1?'':'s'}`}
function explanation(){return `${phrase(q.d.h,'hundred')}, ${phrase(q.d.t,'ten')}, and ${phrase(q.d.o,'one')} make ${value(q.d)}.`}
function expandedText(){return `${q.d.h*100} + ${q.d.t*10} + ${q.d.o} = ${value(q.d)}`}
function highlight(){document.querySelectorAll('.group').forEach(g=>g.classList.add('hi'))}
function record(firstTry){data.total++;if(firstTry)data.first++;q.tags.forEach(k=>{if(!data.skills[k])data.skills[k]=[0,0];data.skills[k][0]++;if(firstTry)data.skills[k][1]++});session.push({firstTry,tags:q.tags});adapt();saveData()}
function adapt(){if(data.mode!=='adaptive'||data.total<8)return;let recentS=session.slice(-8);if(recentS.length<8)return;let pct=recentS.filter(x=>x.firstTry).length/8;if(pct>=.85&&data.currentStage<7)data.currentStage++;else if(pct<.65&&data.currentStage>2)data.currentStage--}
function submit(){if(locked)return;let raw=answer.value.trim();if(!/^\d{1,3}$/.test(raw)){feedback.textContent='Enter a whole number from 0 to 999.';feedback.className='feedback bad';return}let n=Number(raw);attempts++;if(n===value(q.d)){locked=true;record(attempts===1);feedback.textContent='Correct. '+explanation();feedback.className='feedback good';expanded.textContent=data.expandedHelp?expandedText():'';highlight();check.classList.add('hidden');next.classList.remove('hidden');next.focus()}else{feedback.className='feedback bad';if(attempts===1){feedback.textContent='Look again: How many hundreds? How many tens? How many ones?';highlight()}else if(attempts===2){feedback.textContent=`${phrase(q.d.h,'hundred')} = ${q.d.h*100}; ${phrase(q.d.t,'ten')} = ${q.d.t*10}; ${phrase(q.d.o,'one')} = ${q.d.o}.`;expanded.textContent=data.expandedHelp?`${q.d.h*100} + ${q.d.t*10} + ${q.d.o} = ?`:'';highlight()}else{feedback.textContent=`The answer is ${value(q.d)}. Type ${value(q.d)} to continue.`;expanded.textContent=expandedText();highlight()}answer.select()}}
function advance(){index++;let len=Number(data.length);if(len&&index>=len)return summary();render()}
function summary(){let first=session.filter(x=>x.firstTry).length,help=session.length-first;$('#card').innerHTML=`<div class="summary"><div class="eyebrow">SESSION COMPLETE</div><h2>Practice summary</h2><p><strong>${first}</strong> correct on the first try<br><strong>${help}</strong> correct after help</p><p>First-try accuracy: <strong>${Math.round(first/session.length*100)}%</strong></p><div class="buttons"><button class="primary" id="again">Start another session</button></div></div>`;$('#fill').style.width='100%';$('#again').onclick=()=>location.reload()}
check.onclick=submit;next.onclick=advance;answer.addEventListener('keydown',e=>{if(e.key==='Enter')locked?advance():submit()});answer.addEventListener('input',()=>answer.value=answer.value.replace(/\D/g,'').slice(0,3));
$('#gear').onclick=()=>{populate();modal.classList.remove('hidden')};$('#close').onclick=()=>modal.classList.add('hidden');$('#mode').onchange=()=>$('#stage').disabled=$('#mode').value==='adaptive';
function populate(){$('#mode').value=data.mode;$('#stage').value=data.stage;$('#stage').disabled=data.mode==='adaptive';$('#length').value=data.length;$('#labels').checked=data.labels;$('#expandedHelp').checked=data.expandedHelp;$('#savedStats').textContent=`Saved: ${data.total} questions, ${data.total?Math.round(data.first/data.total*100):0}% first-try accuracy, adaptive stage ${data.currentStage}.`}
$('#save').onclick=()=>{data.mode=$('#mode').value;data.stage=Number($('#stage').value);data.length=Number($('#length').value);data.labels=$('#labels').checked;data.expandedHelp=$('#expandedHelp').checked;saveData();location.reload()};$('#reset').onclick=()=>{if(confirm('Reset all saved progress?')){localStorage.removeItem('placeValueData');location.reload()}};
render();
window.runSelfTests=()=>{let tests=[value(digits(108))===108,digits(120).t===2&&digits(120).o===0,digits(305).h===3&&digits(305).t===0,tags(digits(300)).includes('bothZero')];console.log(tests);return {passed:tests.filter(Boolean).length,total:tests.length}}
})();
</script>
</body>
</html>
