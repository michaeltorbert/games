<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>James's Place Value Practice</title><style>
:root{--ink:#23241f;--muted:#686960;--line:#d7d1c4;--page:#f3efe5;--green:#365f4b;--bad:#8b4037}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:clamp(1.25rem,5vw,1.9rem);margin:4px 0}.count{font-weight:850;color:var(--muted)}.bar{height:8px;background:#ddd8cd;border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--green);width:0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 28px #0000000d}.tag{text-align:center;color:var(--green);letter-spacing:.16em;font-weight:900;font-size:.78rem;margin:0 0 5px}h2{text-align:center;margin:0;font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.08}.sub{text-align:center;color:var(--muted);margin:7px 0 13px}.sheet{border:1px solid var(--line);border-radius:17px;padding:14px 8px;background:linear-gradient(#ece8de 1px,transparent 1px),linear-gradient(90deg,#ece8de 1px,transparent 1px),#fffefb;background-size:22px 22px}.heads,.blocks{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:5px;max-width:620px;margin:auto}.heads{text-align:center;color:var(--muted);font-weight:900;font-size:.8rem;margin-bottom:8px}.blocks{min-height:135px;align-items:center}.place{display:flex;justify-content:center;align-items:center;align-content:center;gap:3px;flex-wrap:wrap;min-width:0}.h{display:grid;grid-template-columns:repeat(2,max-content);gap:4px}.h.dense .flat{width:40px;height:40px}.t{flex-wrap:nowrap;gap:2px}.o{display:grid;grid-template-columns:repeat(3,17px);gap:4px}.flat{width:92px;height:92px}.rod{width:11px;height:92px}.cube{width:17px;height:17px}.rule{height:1px;background:var(--line);margin:12px 0}.label{text-align:center;color:var(--muted);font-weight:850;margin-bottom:7px}.answer{display:flex;gap:9px;max-width:480px;margin:auto}.answer input{width:100%;height:67px;border:3px solid #99998f;border-radius:17px;text-align:center;font-size:2.3rem;font-weight:900;outline:none}.answer input:focus{border-color:var(--green);box-shadow:0 0 0 4px #365f4b22}.answer button,.next,.again{border:0;border-radius:15px;background:var(--green);color:#fff;font-size:1.15rem;font-weight:900;min-height:60px;padding:0 24px}.feedback{min-height:52px;text-align:center;padding:11px 3px 0;font-weight:850;color:var(--bad)}.feedback.good{color:var(--green)}.hint{display:none;text-align:center;background:#fbf3dc;border-radius:13px;padding:11px;line-height:1.45;font-weight:800}.hint.show{display:block}.next{display:none;margin:8px auto 0}.next.show{display:block}.summary{display:none;text-align:center}.summary.show{display:block}@media(max-width:520px){.card{padding:14px 9px}.sheet{padding:12px 6px}.answer{flex-direction:column}.flat{width:88px;height:88px}.rod{height:88px}.blocks{min-height:125px}}
</style></head><body><main class="app"><div class="top"><h1>Hundreds, Tens, and Ones</h1><span class="count" id="count">1 of 10</span></div><div class="bar"><i id="bar"></i></div><section class="card" id="practice"><p class="tag">BLOCKS TO NUMBER</p><h2>What number do the blocks show?</h2><p class="sub">Count the flats, rods, and cubes.</p><div class="sheet"><div class="heads"><span>hundreds</span><span>tens</span><span>ones</span></div><div class="blocks"><div class="place h" id="h"></div><div class="place t" id="t"></div><div class="place o" id="o"></div></div><div class="rule"></div><div class="label">Write the number</div><div class="answer"><input id="answer" inputmode="numeric" maxlength="3" autocomplete="off"><button id="check">Check</button></div><div class="feedback" id="feedback"></div><div class="hint" id="hint"></div><button class="next" id="next">Next</button></div></section><section class="card summary" id="summary"><h2>Session complete</h2><p id="score"></p><p id="need"></p><button class="again" id="again">Practice again</button></section></main><script>
'use strict';const $=s=>document.querySelector(s),types=['all','zeroTens','zeroOnes','all','exact','all','zeroTens','zeroOnes','all','exact'];let index=0,q,tries=0,first=0,helped=0,recent=[],miss={all:0,zeroTens:0,zeroOnes:0,exact:0};
function S(tag,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}function flat(){const s=S('svg',{viewBox:'0 0 104 104',class:'flat'});s.append(S('rect',{x:2,y:2,width:100,height:100,fill:'#fff8e4',stroke:'#292a27','stroke-width':3}));for(let i=1;i<10;i++){let p=2+i*10;s.append(S('line',{x1:2,y1:p,x2:102,y2:p,stroke:'#686964','stroke-width':.8}));s.append(S('line',{x1:p,y1:2,x2:p,y2:102,stroke:'#686964','stroke-width':.8}))}return s}function rod(){const s=S('svg',{viewBox:'0 0 16 104',class:'rod'});s.append(S('rect',{x:1,y:2,width:14,height:100,fill:'#fff8e4',stroke:'#292a27','stroke-width':2}));for(let i=1;i<10;i++){let p=2+i*10;s.append(S('line',{x1:1,y1:p,x2:15,y2:p,stroke:'#686964','stroke-width':.8}))}return s}function cube(){const s=S('svg',{viewBox:'0 0 18 18',class:'cube'});s.append(S('rect',{x:1.5,y:1.5,width:15,height:15,fill:'#fff8e4',stroke:'#292a27','stroke-width':2}));return s}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}function make(type){let h=1,t=0,o=0;if(type==='all'){t=rnd(1,4);o=rnd(1,9)}if(type==='zeroTens')o=rnd(1,9);if(type==='zeroOnes')t=rnd(1,5);let value=100*h+10*t+o,guard=0;while(recent.includes(value)&&guard++<30){if(type==='all')o=o%9+1;else if(type==='zeroTens')o=o%9+1;else if(type==='zeroOnes')t=t%5+1;value=100*h+10*t+o}recent.push(value);if(recent.length>9)recent.shift();return{h,t,o,value,type}}
function draw(el,n,maker){el.innerHTML='';for(let i=0;i<n;i++)el.append(maker())}function render(){q=make(types[index%types.length]);tries=0;draw($('#h'),q.h,flat);draw($('#t'),q.t,rod);draw($('#o'),q.o,cube);$('#h').classList.toggle('dense',q.h>1);$('#answer').value='';$('#answer').disabled=false;$('#check').disabled=false;$('#feedback').textContent='';$('#feedback').className='feedback';$('#hint').className='hint';$('#next').className='next';$('#count').textContent=`${index+1} of 10`;$('#bar').style.width=`${index*10}%`;requestAnimationFrame(()=>$('#answer').focus())}
function words(n,w){return`${n} ${w}${n===1?'':'s'}`}function check(){let raw=$('#answer').value.trim();if(!/^\d{1,3}$/.test(raw)){show('Enter a whole number.');return}tries++;if(+raw===q.value){tries===1?first++:helped++;$('#feedback').className='feedback good';$('#feedback').textContent=`Correct. ${words(q.h,'hundred')}, ${words(q.t,'ten')}, and ${words(q.o,'one')} make ${q.value}.`;$('#answer').disabled=$('#check').disabled=true;$('#next').className='next show';return}miss[q.type]++;if(tries===1){show('Look again. Count the flats, then the rods, then the cubes.');return}$('#hint').className='hint show';$('#hint').innerHTML=`${q.h} hundred = ${q.h*100}<br>${q.t} tens = ${q.t*10}<br>${q.o} ones = ${q.o}<br><strong>${q.h*100} + ${q.t*10} + ${q.o} = ?</strong>`;show('Use the place values below, then try again.')}function show(x){$('#feedback').textContent=x;$('#answer').select()}function next(){if(++index===10)return finish();render()}function finish(){$('#practice').style.display='none';$('#summary').className='card summary show';$('#count').textContent='Finished';$('#bar').style.width='100%';$('#score').textContent=`${first} correct on the first try; ${helped} correct after help.`;let k=Object.entries(miss).sort((a,b)=>b[1]-a[1])[0],names={all:'numbers using all three places',zeroTens:'numbers with zero tens, such as 104',zeroOnes:'numbers with zero ones, such as 130',exact:'exact hundreds, such as 100'};$('#need').textContent=k[1]?`Most practice needed: ${names[k[0]]}.`:'No repeated difficulty appeared.'}function restart(){index=first=helped=0;recent=[];miss={all:0,zeroTens:0,zeroOnes:0,exact:0};$('#summary').className='card summary';$('#practice').style.display='block';render()}
$('#check').onclick=check;$('#next').onclick=next;$('#again').onclick=restart;$('#answer').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,3);$('#answer').onkeydown=e=>{if(e.key==='Enter')$('#next').classList.contains('show')?next():check()};render();
</script></body></html>
